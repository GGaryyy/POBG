<rect x="20.0" y="20.0" width="461.8" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="250.9" y="44.4" text-anchor="middle">The scope is atlas (no other argument)</text><rect x="20.0" y="98.0" width="461.8" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="250.9" y="122.4" text-anchor="middle">One call, 2 requests, 0.8 s apart</text><text x="250.9" y="142.4" text-anchor="middle">poe2db&#x27;s Waystones page (English and Chinese)</text><rect x="20.0" y="196.0" width="461.8" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="250.9" y="220.4" text-anchor="middle">Waystone tiers and area levels, the resistance penalty table</text><text x="250.9" y="240.4" text-anchor="middle">Waystone modifiers: Chinese rows joined by place,</text><text x="250.9" y="260.4" text-anchor="middle">checked by level and prefix / suffix</text><rect x="20.0" y="314.0" width="461.8" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="250.9" y="338.4" text-anchor="middle">Not taken: map bosses, desecrated modifiers, atlas passives</text><polygon points="34.0,392.0 467.8,392.0 481.8,432.0 467.8,472.0 34.0,472.0 20.0,432.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="250.9" y="416.4" text-anchor="middle">Above the minimums?</text><text x="250.9" y="436.4" text-anchor="middle">Tiers, the map stage tiers (1, 10, 16) all there,</text><text x="250.9" y="456.4" text-anchor="middle">penalty rows, modifiers, Chinese share</text><rect x="545.8" y="412.0" width="229.0" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="660.3" y="436.4" text-anchor="middle">Refused. The old data stays</text><rect x="20.0" y="510.0" width="461.8" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="250.9" y="534.4" text-anchor="middle">Writes data/atlas/atlas.json and waystone_mods.jsonl</text><text x="250.9" y="554.4" text-anchor="middle">The stage table gets Tier 1, 10 and 16 after the acts</text><rect x="20.0" y="608.0" width="461.8" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="250.9" y="632.4" text-anchor="middle">Report waystone_tiers, area_levels,</text><text x="250.9" y="652.4" text-anchor="middle">resistance_penalty_rows and waystone_modifiers</text>
