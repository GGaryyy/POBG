<rect x="20.0" y="20.0" width="515.0" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="277.5" y="44.4" text-anchor="middle">範圍是 ladder（不接受其他參數）</text><rect x="20.0" y="98.0" width="515.0" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="277.5" y="122.4" text-anchor="middle">一次呼叫，最多 14 個請求到 poe.ninja，間隔 0.8 秒</text><rect x="20.0" y="176.0" width="515.0" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="277.5" y="200.4" text-anchor="middle">讀目前聯盟與數種排序各前 100 名，共約 600 個角色</text><rect x="20.0" y="254.0" width="515.0" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="277.5" y="278.4" text-anchor="middle">只留職業、等級、主技能、寶石、keystone、聯盟、排名</text><text x="277.5" y="298.4" text-anchor="middle">角色與帳號名稱在寫入前丟棄</text><polygon points="34.0,352.0 521.0,352.0 535.0,382.0 521.0,412.0 34.0,412.0 20.0,382.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="277.5" y="376.4" text-anchor="middle">快照看起來正常？</text><text x="277.5" y="396.4" text-anchor="middle">至少 100 筆、九成有職業、半數有技能；同聯盟時不少於上一份的一半</text><rect x="599.0" y="362.0" width="177.6" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="687.8" y="386.4" text-anchor="middle">拒絕寫入，保留舊快照</text><rect x="20.0" y="450.0" width="515.0" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="277.5" y="474.4" text-anchor="middle">取代天梯快照</text><rect x="20.0" y="528.0" width="515.0" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="277.5" y="552.4" text-anchor="middle">回報 records、league；聯盟換了還有 previous_league</text>
<text x="567.0" y="375.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="285.5" y="428.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text>
