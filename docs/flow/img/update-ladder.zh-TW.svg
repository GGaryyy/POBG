<svg xmlns="http://www.w3.org/2000/svg" width="797" height="588" viewBox="0 0 797 588" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
