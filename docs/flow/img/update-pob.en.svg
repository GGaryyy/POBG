<svg xmlns="http://www.w3.org/2000/svg" width="881" height="1550" viewBox="0 0 881 1550" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:update-pob: update your Path of Building</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="880" height="1549" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="289.1,60.0 289.1,108.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="558.1,128.0 622.1,128.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,148.0 289.1,216.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="558.1,236.0 622.1,236.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,256.0 289.1,314.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,374.0 289.1,412.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,492.0 289.1,530.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,590.0 289.1,628.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="558.1,648.0 622.1,648.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,668.0 289.1,706.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,806.0 289.1,844.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="558.1,864.0 622.1,864.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,884.0 289.1,922.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,982.0 289.1,1020.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,1080.0 289.1,1128.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="558.1,1148.0 622.1,1148.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,1168.0 289.1,1216.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,1256.0 289.1,1294.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,1354.0 289.1,1392.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="289.1,1432.0 289.1,1470.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="20.0" width="538.1" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="289.1" y="44.4" text-anchor="middle">/pobg:update-pob folder</text><polygon points="34.0,108.0 544.1,108.0 558.1,128.0 544.1,148.0 34.0,148.0 20.0,128.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="289.1" y="132.4" text-anchor="middle">Was a folder given?</text><rect x="622.1" y="98.0" width="238.5" height="60.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="741.3" y="122.4" text-anchor="middle">Ask for it and stop.</text><text x="741.3" y="142.4" text-anchor="middle">The disk is never searched</text><polygon points="34.0,216.0 544.1,216.0 558.1,236.0 544.1,256.0 34.0,256.0 20.0,236.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="289.1" y="240.4" text-anchor="middle">Does the path contain a double quote, a backtick or a dollar sign?</text><rect x="622.1" y="196.0" width="238.5" height="80.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="741.3" y="220.4" text-anchor="middle">Nothing is run</text><text x="741.3" y="240.4" text-anchor="middle">Rename the folder,</text><text x="741.3" y="260.4" text-anchor="middle">or run the command yourself</text><rect x="20.0" y="314.0" width="538.1" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="289.1" y="338.4" text-anchor="middle">First run: with --check</text><text x="289.1" y="358.4" text-anchor="middle">2 requests to GitHub, writes nothing</text><rect x="20.0" y="412.0" width="538.1" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="289.1" y="436.4" text-anchor="middle">Recognise the folder</text><text x="289.1" y="456.4" text-anchor="middle">manifest.xml: Path of Building alone</text><text x="289.1" y="476.4" text-anchor="middle">PoeCharm3.exe: PoeCharm2 with PoB inside</text><rect x="20.0" y="530.0" width="538.1" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="289.1" y="554.4" text-anchor="middle">Report installed and latest</text><text x="289.1" y="574.4" text-anchor="middle">For PoeCharm2 also its latest commit and date</text><polygon points="34.0,628.0 544.1,628.0 558.1,648.0 544.1,668.0 34.0,668.0 20.0,648.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="289.1" y="652.4" text-anchor="middle">up_to_date?</text><rect x="622.1" y="628.0" width="238.5" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="741.3" y="652.4" text-anchor="middle">Already current. Stop</text><rect x="20.0" y="706.0" width="538.1" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="289.1" y="730.4" text-anchor="middle">Explain what the update does</text><text x="289.1" y="750.4" text-anchor="middle">Downloads PoB&#x27;s release (about 380 MB), checked against its SHA-256</text><text x="289.1" y="770.4" text-anchor="middle">PoeCharm2 also about 30 MB, with no published checksum</text><text x="289.1" y="790.4" text-anchor="middle">Unpacks into a new folder next to the old one</text><polygon points="34.0,844.0 544.1,844.0 558.1,864.0 544.1,884.0 34.0,884.0 20.0,864.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="289.1" y="868.4" text-anchor="middle">Does the user agree?</text><rect x="622.1" y="844.0" width="238.5" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="741.3" y="868.4" text-anchor="middle">Stop. Nothing downloaded</text><rect x="20.0" y="922.0" width="538.1" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="289.1" y="946.4" text-anchor="middle">Second run: without --check</text><text x="289.1" y="966.4" text-anchor="middle">Can take minutes, with a 10-minute timeout</text><rect x="20.0" y="1020.0" width="538.1" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="289.1" y="1044.4" text-anchor="middle">Downloads into a temporary work folder</text><text x="289.1" y="1064.4" text-anchor="middle">PoB never more than its published size, PoeCharm2 at most 200 MB</text><polygon points="34.0,1128.0 544.1,1128.0 558.1,1148.0 544.1,1168.0 34.0,1168.0 20.0,1148.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="289.1" y="1152.4" text-anchor="middle">Does the SHA-256 match what GitHub publishes?</text><rect x="622.1" y="1118.0" width="238.5" height="60.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="741.3" y="1142.4" text-anchor="middle">Error, work folder removed</text><text x="741.3" y="1162.4" text-anchor="middle">The old folder is unchanged</text><rect x="20.0" y="1216.0" width="538.1" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="289.1" y="1240.4" text-anchor="middle">Unpacks: refuses paths that leave the folder, bounds the unpacked size</text><rect x="20.0" y="1294.0" width="538.1" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="289.1" y="1318.4" text-anchor="middle">Copies saved builds (Builds) and PoeCharm2&#x27;s language setting</text><text x="289.1" y="1338.4" text-anchor="middle">Settings.xml is never opened or copied</text><rect x="20.0" y="1392.0" width="538.1" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="289.1" y="1416.4" text-anchor="middle">Renames to the new folder, retried 5 times if a virus scan blocks it</text><rect x="20.0" y="1470.0" width="538.1" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="289.1" y="1494.4" text-anchor="middle">Report new_folder, version, builds_copied, checksum, next</text><text x="289.1" y="1514.4" text-anchor="middle">The old folder is never changed or deleted. Sign in again</text>
<text x="590.1" y="121.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="297.1" y="164.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="590.1" y="229.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="297.1" y="272.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="590.1" y="641.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="297.1" y="684.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="590.1" y="857.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="297.1" y="900.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="590.1" y="1141.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="297.1" y="1184.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text>
</svg>
