<svg xmlns="http://www.w3.org/2000/svg" width="1043" height="806" viewBox="0 0 1043 806" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:update glossary</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="1042" height="805" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="379.3,60.0 379.3,98.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="379.3,158.0 379.3,196.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="379.3,296.0 379.3,334.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="590.2,354.0 723.4,354.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="379.3,374.0 379.3,432.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="590.2,452.0 723.4,452.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="168.4,452.0 142.4,452.0 142.4,128.0 168.4,128.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="379.3,472.0 379.3,530.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="590.2,560.0 723.4,560.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="379.3,590.0 379.3,628.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="379.3,688.0 379.3,726.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="168.4" y="20.0" width="421.8" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="379.3" y="44.4" text-anchor="middle">The scope is glossary (no other argument)</text><rect x="168.4" y="98.0" width="421.8" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="379.3" y="122.4" text-anchor="middle">update_data: at most 50 requests this call,</text><text x="379.3" y="142.4" text-anchor="middle">under a minute</text><rect x="168.4" y="196.0" width="421.8" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="379.3" y="220.4" text-anchor="middle">Terms are found through the listings and</text><text x="379.3" y="240.4" text-anchor="middle">a few gem pages, then each term&#x27;s English</text><text x="379.3" y="260.4" text-anchor="middle">and Chinese hover snippet is fetched</text><text x="379.3" y="280.4" text-anchor="middle">About 750 requests in all</text><polygon points="182.4,334.0 576.2,334.0 590.2,354.0 576.2,374.0 182.4,374.0 168.4,354.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="379.3" y="358.4" text-anchor="middle">Five network errors in a row?</text><rect x="723.4" y="334.0" width="299.8" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="873.3" y="358.4" text-anchor="middle">This call gives up. Progress is kept</text><polygon points="182.4,432.0 576.2,432.0 590.2,452.0 576.2,472.0 182.4,472.0 168.4,452.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="379.3" y="456.4" text-anchor="middle">done: is the whole glossary fetched?</text><rect x="723.4" y="412.0" width="299.8" height="80.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="873.3" y="436.4" text-anchor="middle">20 calls made: ask the user to run the</text><text x="873.3" y="456.4" text-anchor="middle">command again within 30 minutes.</text><text x="873.3" y="476.4" text-anchor="middle">It continues where it stopped</text><polygon points="182.4,530.0 576.2,530.0 590.2,560.0 576.2,590.0 182.4,590.0 168.4,560.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="379.3" y="554.4" text-anchor="middle">At least 90% of the known terms reached, and</text><text x="379.3" y="574.4" text-anchor="middle">Chinese text for at least 50% of those that had it?</text><rect x="723.4" y="540.0" width="299.8" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="873.3" y="564.4" text-anchor="middle">Not written</text><rect x="168.4" y="628.0" width="421.8" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="379.3" y="652.4" text-anchor="middle">Merged field by field and written at once.</text><text x="379.3" y="672.4" text-anchor="middle">Terms it could not reach keep their previous text</text><rect x="168.4" y="726.0" width="421.8" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="379.3" y="750.4" text-anchor="middle">Report records, refreshed, changed,</text><text x="379.3" y="770.4" text-anchor="middle">added, kept_without_refresh</text>
<text x="656.8" y="347.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="387.3" y="390.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="656.8" y="445.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no, 20 calls made</text><text x="134.4" y="456.0" text-anchor="end" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no, under 20 calls</text><text x="387.3" y="488.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="656.8" y="553.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="387.3" y="606.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text>
</svg>
