<rect x="147.1" y="20.0" width="451.7" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="372.9" y="44.4" text-anchor="middle">範圍是 glossary（不接受其他參數）</text><rect x="147.1" y="98.0" width="451.7" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="372.9" y="122.4" text-anchor="middle">update_data：這次呼叫最多 50 個請求，約一分鐘內</text><rect x="147.1" y="176.0" width="451.7" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="372.9" y="200.4" text-anchor="middle">透過列表頁與少數寶石頁找到名詞，</text><text x="372.9" y="220.4" text-anchor="middle">再抓每個名詞的中英 hover 片段</text><text x="372.9" y="240.4" text-anchor="middle">全部約 750 個請求</text><polygon points="161.1,294.0 584.8,294.0 598.8,314.0 584.8,334.0 161.1,334.0 147.1,314.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="372.9" y="318.4" text-anchor="middle">連續 5 次網路錯誤？</text><rect x="713.9" y="294.0" width="260.6" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="844.2" y="318.4" text-anchor="middle">這次呼叫放棄，進度保留</text><polygon points="161.1,392.0 584.8,392.0 598.8,412.0 584.8,432.0 161.1,432.0 147.1,412.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="372.9" y="416.4" text-anchor="middle">done：全部抓完了？</text><rect x="713.9" y="372.0" width="260.6" height="80.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="844.2" y="396.4" text-anchor="middle">已滿 20 次呼叫：</text><text x="844.2" y="416.4" text-anchor="middle">請使用者 30 分鐘內再下一次指令，</text><text x="844.2" y="436.4" text-anchor="middle">會從停下的地方接續</text><polygon points="161.1,490.0 584.8,490.0 598.8,510.0 584.8,530.0 161.1,530.0 147.1,510.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="372.9" y="514.4" text-anchor="middle">抓到的名詞不少於原有的 90%，中文內容不少於原有的 50%？</text><rect x="713.9" y="490.0" width="260.6" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="844.2" y="514.4" text-anchor="middle">不寫入</text><rect x="147.1" y="568.0" width="451.7" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="372.9" y="592.4" text-anchor="middle">逐欄位合併後一次寫入；抓不到的名詞保留原本的內容</text><rect x="147.1" y="646.0" width="451.7" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="372.9" y="670.4" text-anchor="middle">回報 records、refreshed、changed、</text><text x="372.9" y="690.4" text-anchor="middle">added、kept_without_refresh</text>
<text x="656.3" y="307.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="380.9" y="350.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="656.3" y="405.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否，已滿 20 次</text><text x="113.1" y="416.0" text-anchor="end" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否，未滿 20 次</text><text x="380.9" y="448.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="656.3" y="503.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="380.9" y="546.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text>
</svg>
