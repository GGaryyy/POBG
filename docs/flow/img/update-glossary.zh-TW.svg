<svg xmlns="http://www.w3.org/2000/svg" width="994" height="726" viewBox="0 0 994 726" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
