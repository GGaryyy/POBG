<svg xmlns="http://www.w3.org/2000/svg" width="908" height="1492" viewBox="0 0 908 1492" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>export_pob 裡面算了什麼</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="907" height="1491" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="267.9,80.0 267.9,118.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,178.0 267.9,226.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="515.7,246.0 579.7,246.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,266.0 267.9,314.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="515.7,354.0 734.1,354.0 734.1,276.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,394.0 267.9,432.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="515.7,452.0 579.7,452.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,472.0 267.9,510.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="734.1,472.0 734.1,618.0 515.7,618.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,550.0 267.9,588.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,648.0 267.9,686.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,786.0 267.9,824.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,864.0 267.9,902.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,1002.0 267.9,1040.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,1080.0 267.9,1118.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="515.7,1060.0 541.7,1060.0 541.7,1276.0 515.7,1276.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,1218.0 267.9,1256.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,1296.0 267.9,1334.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,1374.0 267.9,1412.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="20.0" width="495.7" height="60.0" rx="22.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="267.9" y="44.4" text-anchor="middle">export_pob 的輸入：職業或昇華、targets、技能組、裝備</text><text x="267.9" y="64.4" text-anchor="middle">可選：character_level、attribute、config</text><rect x="20.0" y="118.0" width="495.7" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="142.4" text-anchor="middle">天賦路線：path_to</text><text x="267.9" y="162.4" text-anchor="middle">PoB 沒有 id 的昇華被拿掉，路線重算</text><rect x="20.0" y="226.0" width="495.7" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="250.4" text-anchor="middle">技能組：逐一檢查名稱；輔助寶石必須能輔助該技能</text><rect x="579.7" y="216.0" width="308.6" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="734.1" y="240.4" text-anchor="middle">不通過的名稱、輔助寶石、</text><text x="734.1" y="260.4" text-anchor="middle">詞綴不放入匯入碼，列在 not_exported</text><rect x="20.0" y="314.0" width="495.7" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="338.4" text-anchor="middle">裝備：基底與傳奇對照本地資料</text><text x="267.9" y="358.4" text-anchor="middle">稀有詞綴必須是該類裝備能出的完整詞綴：3 前綴 + 3 後綴、同族群一條</text><text x="267.9" y="378.4" text-anchor="middle">數值取最高階的上限；副手規則依 PoB</text><polygon points="34.0,432.0 501.7,432.0 515.7,452.0 501.7,472.0 34.0,472.0 20.0,452.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="267.9" y="456.4" text-anchor="middle">有指定 character_level？</text><rect x="579.7" y="432.0" width="308.6" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="734.1" y="456.4" text-anchor="middle">使用指定的等級；點數需要更高等級時加註</text><rect x="20.0" y="510.0" width="495.7" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="534.4" text-anchor="middle">用掉的天賦點 → PoB 的等級公式與章節表（123 點為 100 級）</text><rect x="20.0" y="588.0" width="495.7" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="612.4" text-anchor="middle">寶石等級：等級表中需求不高於角色等級的最高一列，最高 20</text><text x="267.9" y="632.4" text-anchor="middle">輔助寶石沒有等級</text><rect x="20.0" y="686.0" width="495.7" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="710.4" text-anchor="middle">屬性</text><text x="267.9" y="730.4" text-anchor="middle">需求 = 各技能寶石需求的最大值、</text><text x="267.9" y="750.4" text-anchor="middle">輔助「+N」的總和、裝備需求的最大值，三者取最大</text><text x="267.9" y="770.4" text-anchor="middle">已有 = 職業基礎值 + 天賦與裝備上的固定屬性</text><rect x="20.0" y="824.0" width="495.7" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="848.4" text-anchor="middle">路線上的屬性天賦點優先補足需求，或依指定的 attribute</text><rect x="20.0" y="902.0" width="495.7" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="926.4" text-anchor="middle">精魂</text><text x="267.9" y="946.4" text-anchor="middle">需求 =（常駐技能保留量 + 輔助的額外保留）× 保留倍率</text><text x="267.9" y="966.4" text-anchor="middle">已有 = 所有精魂任務獎勵 + 權杖基礎精魂 + 裝備與天賦的固定精魂</text><text x="267.9" y="986.4" text-anchor="middle">只給範圍或沒給保留量的技能列入 unknown</text><polygon points="34.0,1040.0 501.7,1040.0 515.7,1060.0 501.7,1080.0 34.0,1080.0 20.0,1060.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="267.9" y="1064.4" text-anchor="middle">config 開啟？（預設開啟）</text><rect x="20.0" y="1118.0" width="495.7" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="1142.4" text-anchor="middle">逐項找依據，有才開啟</text><text x="267.9" y="1162.4" text-anchor="middle">球：流派會獲得　　敵人狀態：流派會造成</text><text x="267.9" y="1182.4" text-anchor="middle">感電、冰緩、點燃：該元素的傷害技能，或攻擊流派的主手武器</text><text x="267.9" y="1202.4" text-anchor="middle">「無法……」的句子排除該技能組　　曝曬、近期暴擊</text><rect x="20.0" y="1256.0" width="495.7" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="1280.4" text-anchor="middle">寫成 PoB 的 XML：Build、Tree、Skills、Items、Config、Notes</text><rect x="20.0" y="1334.0" width="495.7" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="1358.4" text-anchor="middle">zlib 壓縮 → urlsafe base64</text><rect x="20.0" y="1412.0" width="495.7" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="267.9" y="1436.4" text-anchor="middle">回傳 code、how_to_import、notes、not_exported、summary</text><text x="267.9" y="1456.4" text-anchor="middle">不寫檔、不連網</text>
<text x="547.7" y="445.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">有</text><text x="275.9" y="488.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">沒有</text><text x="275.9" y="1096.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="549.7" y="1064.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text>
</svg>
