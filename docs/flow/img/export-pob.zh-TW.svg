<svg xmlns="http://www.w3.org/2000/svg" width="892" height="1572" viewBox="0 0 892 1572" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>export_pob 裡面算了什麼</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="891" height="1571" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="267.9,80.0 267.9,118.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,178.0 267.9,226.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="515.7,246.0 579.7,246.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,266.0 267.9,314.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="515.7,354.0 726.0,354.0 726.0,276.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,394.0 267.9,472.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="515.7,492.0 579.7,492.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,512.0 267.9,590.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="726.0,552.0 726.0,698.0 515.7,698.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,630.0 267.9,668.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,728.0 267.9,766.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,866.0 267.9,904.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,944.0 267.9,982.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,1082.0 267.9,1120.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,1160.0 267.9,1198.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="515.7,1140.0 541.7,1140.0 541.7,1356.0 515.7,1356.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,1298.0 267.9,1336.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,1376.0 267.9,1414.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="267.9,1454.0 267.9,1492.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="20.0" width="495.7" height="60.0" rx="22.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="267.9" y="44.4" text-anchor="middle">export_pob 輸入：職業或昇華、目標天賦、技能組、裝備</text><text x="267.9" y="64.4" text-anchor="middle">選填：character_level 或 stage（章節階段）、attribute、config</text><rect x="20.0" y="118.0" width="495.7" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="142.4" text-anchor="middle">天賦路線：path_to</text><text x="267.9" y="162.4" text-anchor="middle">PoB 沒有 id 的昇華被拿掉，路線重算</text><rect x="20.0" y="226.0" width="495.7" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="250.4" text-anchor="middle">技能組：逐一檢查名稱；輔助寶石必須能輔助該技能</text><rect x="579.7" y="216.0" width="292.6" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="726.0" y="240.4" text-anchor="middle">不通過的名稱、輔助寶石、</text><text x="726.0" y="260.4" text-anchor="middle">詞綴不放入匯入碼，列在 not_exported</text><rect x="20.0" y="314.0" width="495.7" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="338.4" text-anchor="middle">裝備：基底與傳奇對照本地資料</text><text x="267.9" y="358.4" text-anchor="middle">稀有詞綴必須是該類裝備能出的完整詞綴：3 前綴 + 3 後綴、同族群一條</text><text x="267.9" y="378.4" text-anchor="middle">數值取最高階的上限；副手規則依 PoB</text><polygon points="34.0,472.0 501.7,472.0 515.7,492.0 501.7,512.0 34.0,512.0 20.0,492.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="267.9" y="496.4" text-anchor="middle">有給 character_level 或 stage？</text><rect x="579.7" y="432.0" width="292.6" height="120.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="726.0" y="456.4" text-anchor="middle">使用該等級；stage 時：等級、</text><text x="726.0" y="476.4" text-anchor="middle">天賦與昇華點、寶石階級、</text><text x="726.0" y="496.4" text-anchor="middle">輔助插槽、物品與詞綴等級、</text><text x="726.0" y="516.4" text-anchor="middle">任務精魂都以該階段為上限，</text><text x="726.0" y="536.4" text-anchor="middle">每階段一個天賦樹</text><rect x="20.0" y="590.0" width="495.7" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="614.4" text-anchor="middle">用掉的天賦點 → PoB 的等級公式與章節表（123 點為 100 級）</text><rect x="20.0" y="668.0" width="495.7" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="692.4" text-anchor="middle">寶石等級：等級表中需求不高於角色等級的最高一列，最高 20</text><text x="267.9" y="712.4" text-anchor="middle">輔助寶石沒有等級</text><rect x="20.0" y="766.0" width="495.7" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="790.4" text-anchor="middle">屬性</text><text x="267.9" y="810.4" text-anchor="middle">需求 = 各技能寶石需求的最大值、</text><text x="267.9" y="830.4" text-anchor="middle">輔助「+N」的總和、裝備需求的最大值，三者取最大</text><text x="267.9" y="850.4" text-anchor="middle">已有 = 職業基礎值 + 天賦與裝備上的固定屬性</text><rect x="20.0" y="904.0" width="495.7" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="928.4" text-anchor="middle">路線上的屬性天賦點優先補足需求，或依指定的 attribute</text><rect x="20.0" y="982.0" width="495.7" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="1006.4" text-anchor="middle">精魂</text><text x="267.9" y="1026.4" text-anchor="middle">需求 =（常駐技能保留量 + 輔助的額外保留）× 保留倍率</text><text x="267.9" y="1046.4" text-anchor="middle">已有 = 所有精魂任務獎勵 + 權杖基礎精魂 + 裝備與天賦的固定精魂</text><text x="267.9" y="1066.4" text-anchor="middle">只給範圍或沒給保留量的技能列入 unknown</text><polygon points="34.0,1120.0 501.7,1120.0 515.7,1140.0 501.7,1160.0 34.0,1160.0 20.0,1140.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="267.9" y="1144.4" text-anchor="middle">config 開啟？（預設開啟）</text><rect x="20.0" y="1198.0" width="495.7" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="1222.4" text-anchor="middle">逐項找依據，有才開啟</text><text x="267.9" y="1242.4" text-anchor="middle">球：流派會獲得　　敵人狀態：流派會造成</text><text x="267.9" y="1262.4" text-anchor="middle">感電、冰緩、點燃：該元素的傷害技能，或攻擊流派的主手武器</text><text x="267.9" y="1282.4" text-anchor="middle">「無法……」的句子排除該技能組　　曝曬、近期暴擊</text><rect x="20.0" y="1336.0" width="495.7" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="1360.4" text-anchor="middle">寫成 PoB 的 XML：Build、Tree、Skills、Items、Config、Notes</text><rect x="20.0" y="1414.0" width="495.7" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="267.9" y="1438.4" text-anchor="middle">zlib 壓縮 → urlsafe base64</text><rect x="20.0" y="1492.0" width="495.7" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="267.9" y="1516.4" text-anchor="middle">回傳 code、how_to_import、notes、not_exported、summary</text><text x="267.9" y="1536.4" text-anchor="middle">不寫檔、不連網</text>
<text x="547.7" y="485.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">有</text><text x="275.9" y="528.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">沒有</text><text x="275.9" y="1176.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="549.7" y="1144.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text>
</svg>
