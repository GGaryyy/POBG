<svg xmlns="http://www.w3.org/2000/svg" width="945" height="1060" viewBox="0 0 945 1060" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:update: the three gem scopes</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="944" height="1059" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="319.1,80.0 319.1,118.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="319.1,158.0 319.1,196.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="319.1,276.0 319.1,314.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="319.1,354.0 319.1,392.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="556.8,412.0 620.8,412.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="319.1,432.0 319.1,500.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="556.8,520.0 620.8,520.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="319.1,540.0 319.1,608.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="772.9,570.0 772.9,638.0 556.8,638.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="319.1,668.0 319.1,716.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="556.8,736.0 620.8,736.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="319.1,756.0 319.1,804.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="319.1,884.0 319.1,922.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="81.5,942.0 55.5,942.0 55.5,638.0 81.5,638.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="319.1,962.0 319.1,1000.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="81.5" y="20.0" width="475.4" height="60.0" rx="22.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="319.1" y="44.4" text-anchor="middle">The scope is skill_gems, spirit_gems or support_gems</text><text x="319.1" y="64.4" text-anchor="middle">Optionally gem names, or &#x27;older than N days&#x27;</text><rect x="81.5" y="118.0" width="475.4" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="319.1" y="142.4" text-anchor="middle">update_data dry_run=true: fetches the listing page, 1 request</text><rect x="81.5" y="196.0" width="475.4" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="319.1" y="220.4" text-anchor="middle">Select the gems to fetch: new, changed on the listing,</text><text x="319.1" y="240.4" text-anchor="middle">named by you, older than N days</text><text x="319.1" y="260.4" text-anchor="middle">A gem fetched in the last 15 minutes is not fetched again</text><rect x="81.5" y="314.0" width="475.4" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="319.1" y="338.4" text-anchor="middle">Tell the user: selected, reasons, added, removed</text><polygon points="95.5,392.0 542.8,392.0 556.8,412.0 542.8,432.0 95.5,432.0 81.5,412.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="319.1" y="416.4" text-anchor="middle">Is selected 0?</text><rect x="620.8" y="392.0" width="304.3" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="772.9" y="416.4" text-anchor="middle">This data set is up to date. Stop</text><polygon points="95.5,500.0 542.8,500.0 556.8,520.0 542.8,540.0 95.5,540.0 81.5,520.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="319.1" y="524.4" text-anchor="middle">Is selected above 60?</text><rect x="620.8" y="470.0" width="304.3" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="772.9" y="494.4" text-anchor="middle">Ask the user to confirm:</text><text x="772.9" y="514.4" text-anchor="middle">one request per gem</text><text x="772.9" y="534.4" text-anchor="middle">Without a yes it stops</text><text x="772.9" y="554.4" text-anchor="middle">and nothing is written</text><rect x="81.5" y="608.0" width="475.4" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="319.1" y="632.4" text-anchor="middle">update_data dry_run=false</text><text x="319.1" y="652.4" text-anchor="middle">At most 20 gems per call (40 at most), 0.8 s between pages</text><polygon points="95.5,716.0 542.8,716.0 556.8,736.0 542.8,756.0 95.5,756.0 81.5,736.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="319.1" y="740.4" text-anchor="middle">Do the pages still parse and pass validation?</text><rect x="620.8" y="706.0" width="304.3" height="60.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="772.9" y="730.4" text-anchor="middle">Stops, nothing is written</text><text x="772.9" y="750.4" text-anchor="middle">Suggests status with the online check</text><rect x="81.5" y="804.0" width="475.4" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="319.1" y="828.4" text-anchor="middle">Writes that gem kind&#x27;s data file</text><text x="319.1" y="848.4" text-anchor="middle">A single page that fails to download is</text><text x="319.1" y="868.4" text-anchor="middle">listed as skipped and picked up next time</text><polygon points="95.5,922.0 542.8,922.0 556.8,942.0 542.8,962.0 95.5,962.0 81.5,942.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="319.1" y="946.4" text-anchor="middle">Is left above 0, with fewer than 10 calls made?</text><rect x="81.5" y="1000.0" width="475.4" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="319.1" y="1024.4" text-anchor="middle">Report updated, added, removed, skipped</text>
<text x="588.8" y="405.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="327.1" y="448.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="588.8" y="513.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="327.1" y="556.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="780.9" y="586.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">confirmed</text><text x="588.8" y="729.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="327.1" y="772.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="47.5" y="946.0" text-anchor="end" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="327.1" y="978.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text>
</svg>
