<svg xmlns="http://www.w3.org/2000/svg" width="911" height="628" viewBox="0 0 911 628" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:update ladder</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="910" height="627" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="293.1,60.0 293.1,98.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="293.1,138.0 293.1,176.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="293.1,236.0 293.1,274.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="293.1,334.0 293.1,372.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="566.1,412.0 630.1,412.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="293.1,452.0 293.1,490.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="293.1,530.0 293.1,568.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="20.0" width="546.1" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="293.1" y="44.4" text-anchor="middle">The scope is ladder (no other argument)</text><rect x="20.0" y="98.0" width="546.1" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="293.1" y="122.4" text-anchor="middle">One call, at most 14 requests to poe.ninja, 0.8 s apart</text><rect x="20.0" y="176.0" width="546.1" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="293.1" y="200.4" text-anchor="middle">Reads the current league and the top 100 of several sort orders,</text><text x="293.1" y="220.4" text-anchor="middle">about 600 characters</text><rect x="20.0" y="274.0" width="546.1" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="293.1" y="298.4" text-anchor="middle">Keeps class, level, main skill, gems, keystones, league, rank</text><text x="293.1" y="318.4" text-anchor="middle">Character and account names are discarded before writing</text><polygon points="34.0,372.0 552.1,372.0 566.1,412.0 552.1,452.0 34.0,452.0 20.0,412.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="293.1" y="396.4" text-anchor="middle">Does the snapshot look right?</text><text x="293.1" y="416.4" text-anchor="middle">At least 100 rows, 90% with a class, half with a skill.</text><text x="293.1" y="436.4" text-anchor="middle">Same league: not below half the previous one</text><rect x="630.1" y="392.0" width="261.0" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="760.6" y="416.4" text-anchor="middle">Refused. The old snapshot stays</text><rect x="20.0" y="490.0" width="546.1" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="293.1" y="514.4" text-anchor="middle">Replaces the ladder snapshot</text><rect x="20.0" y="568.0" width="546.1" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="293.1" y="592.4" text-anchor="middle">Report records and league, and previous_league when the league changed</text>
<text x="598.1" y="405.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="301.1" y="468.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text>
</svg>
