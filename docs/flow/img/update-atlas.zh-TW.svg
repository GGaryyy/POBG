<rect x="20.0" y="20.0" width="566.0" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="303.0" y="44.4" text-anchor="middle">範圍是 atlas（不接受其他參數）</text><rect x="20.0" y="98.0" width="566.0" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="303.0" y="122.4" text-anchor="middle">一次呼叫，2 個請求，間隔 0.8 秒</text><text x="303.0" y="142.4" text-anchor="middle">poe2db 換界石頁（中英）</text><rect x="20.0" y="196.0" width="566.0" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="303.0" y="220.4" text-anchor="middle">換界石階級與區域等級、抗性懲罰表</text><text x="303.0" y="240.4" text-anchor="middle">換界石詞綴：中文以列的位置合併，核對等級與前後綴</text><rect x="20.0" y="294.0" width="566.0" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="303.0" y="318.4" text-anchor="middle">不收：地圖頭目、褻瀆詞綴、輿圖天賦</text><polygon points="34.0,372.0 572.0,372.0 586.0,402.0 572.0,432.0 34.0,432.0 20.0,402.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="303.0" y="396.4" text-anchor="middle">達到下限？</text><text x="303.0" y="416.4" text-anchor="middle">階級數、地圖階段的階級（1、10、16）都在、懲罰表列數、詞綴數、中文比例</text><rect x="650.0" y="382.0" width="177.6" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="738.8" y="406.4" text-anchor="middle">拒絕寫入，保留舊資料</text><rect x="20.0" y="470.0" width="566.0" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="303.0" y="494.4" text-anchor="middle">寫入 data/atlas/atlas.json 與 waystone_mods.jsonl</text><text x="303.0" y="514.4" text-anchor="middle">流派階段表在章節後接上 T1、T10、T16</text><rect x="20.0" y="568.0" width="566.0" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="303.0" y="592.4" text-anchor="middle">回報 waystone_tiers、area_levels、</text><text x="303.0" y="612.4" text-anchor="middle">resistance_penalty_rows、waystone_modifiers</text>
<text x="618.0" y="395.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="311.0" y="448.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text>
</svg>
