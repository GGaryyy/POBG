<svg xmlns="http://www.w3.org/2000/svg" width="947" height="1732" viewBox="0 0 947 1732" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>What export_pob works out</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="946" height="1731" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="290.8,80.0 290.8,118.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.8,178.0 290.8,226.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="561.6,256.0 625.6,256.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.8,286.0 290.8,334.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="561.6,384.0 776.1,384.0 776.1,296.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.8,434.0 290.8,522.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="561.6,542.0 625.6,542.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.8,562.0 290.8,650.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="776.1,612.0 776.1,768.0 561.6,768.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.8,690.0 290.8,728.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.8,808.0 290.8,846.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.8,946.0 290.8,984.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.8,1044.0 290.8,1082.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.8,1222.0 290.8,1260.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.8,1300.0 290.8,1338.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="561.6,1280.0 587.6,1280.0 587.6,1516.0 561.6,1516.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.8,1458.0 290.8,1496.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.8,1536.0 290.8,1574.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.8,1614.0 290.8,1652.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="20.0" width="541.6" height="60.0" rx="22.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="290.8" y="44.4" text-anchor="middle">export_pob input: class or ascendancy, targets, skill groups, gear</text><text x="290.8" y="64.4" text-anchor="middle">Optional: character_level or stage (a campaign stage), attribute, config</text><rect x="20.0" y="118.0" width="541.6" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.8" y="142.4" text-anchor="middle">Passive route: path_to</text><text x="290.8" y="162.4" text-anchor="middle">An ascendancy PoB has no id for is dropped and the route is made again</text><rect x="20.0" y="226.0" width="541.6" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.8" y="250.4" text-anchor="middle">Skill groups: each name is checked.</text><text x="290.8" y="270.4" text-anchor="middle">A support must be able to support the skill</text><rect x="625.6" y="216.0" width="301.1" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="776.1" y="240.4" text-anchor="middle">Names, supports and modifiers</text><text x="776.1" y="260.4" text-anchor="middle">that fail stay out of the code</text><text x="776.1" y="280.4" text-anchor="middle">and are listed in not_exported</text><rect x="20.0" y="334.0" width="541.6" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.8" y="358.4" text-anchor="middle">Gear: bases and uniques against the local data</text><text x="290.8" y="378.4" text-anchor="middle">A rare&#x27;s modifiers must be whole modifiers the item class can roll:</text><text x="290.8" y="398.4" text-anchor="middle">3 prefixes + 3 suffixes, one per family</text><text x="290.8" y="418.4" text-anchor="middle">Values at the upper end of the best tier. Off-hand rules follow PoB</text><polygon points="34.0,522.0 547.6,522.0 561.6,542.0 547.6,562.0 34.0,562.0 20.0,542.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="290.8" y="546.4" text-anchor="middle">Was character_level or stage given?</text><rect x="625.6" y="472.0" width="301.1" height="140.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="776.1" y="496.4" text-anchor="middle">Use that level. With stage,</text><text x="776.1" y="516.4" text-anchor="middle">the stage&#x27;s limits hold: level,</text><text x="776.1" y="536.4" text-anchor="middle">passive and ascendancy points,</text><text x="776.1" y="556.4" text-anchor="middle">gem tiers, support sockets,</text><text x="776.1" y="576.4" text-anchor="middle">item and modifier levels, quest Spirit;</text><text x="776.1" y="596.4" text-anchor="middle">one passive tree per stage</text><rect x="20.0" y="650.0" width="541.6" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.8" y="674.4" text-anchor="middle">Points spent → PoB&#x27;s level formula and act table (123 points is level 100)</text><rect x="20.0" y="728.0" width="541.6" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.8" y="752.4" text-anchor="middle">Gem levels:</text><text x="290.8" y="772.4" text-anchor="middle">the highest level-table row the character level allows, at most 20</text><text x="290.8" y="792.4" text-anchor="middle">Support gems have no level</text><rect x="20.0" y="846.0" width="541.6" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.8" y="870.4" text-anchor="middle">Attributes</text><text x="290.8" y="890.4" text-anchor="middle">need = the highest of: each skill gem&#x27;s requirement,</text><text x="290.8" y="910.4" text-anchor="middle">the supports&#x27; +N summed, the highest gear requirement</text><text x="290.8" y="930.4" text-anchor="middle">have = class base + fixed attributes on passives and gear</text><rect x="20.0" y="984.0" width="541.6" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.8" y="1008.4" text-anchor="middle">Attribute passives on the route cover the requirements first,</text><text x="290.8" y="1028.4" text-anchor="middle">or follow attribute</text><rect x="20.0" y="1082.0" width="541.6" height="140.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.8" y="1106.4" text-anchor="middle">Spirit</text><text x="290.8" y="1126.4" text-anchor="middle">need = (persistent skill&#x27;s reservation +</text><text x="290.8" y="1146.4" text-anchor="middle">supports&#x27; extra) × reservation multipliers</text><text x="290.8" y="1166.4" text-anchor="middle">have = every Spirit quest reward + a sceptre&#x27;s</text><text x="290.8" y="1186.4" text-anchor="middle">base Spirit + fixed Spirit on gear and passives</text><text x="290.8" y="1206.4" text-anchor="middle">Range-only or missing reservations are listed in unknown</text><polygon points="34.0,1260.0 547.6,1260.0 561.6,1280.0 547.6,1300.0 34.0,1300.0 20.0,1280.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="290.8" y="1284.4" text-anchor="middle">Is config on? (on by default)</text><rect x="20.0" y="1338.0" width="541.6" height="120.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.8" y="1362.4" text-anchor="middle">Each option needs evidence in the build</text><text x="290.8" y="1382.4" text-anchor="middle">Charges it gains. Enemy states it inflicts</text><text x="290.8" y="1402.4" text-anchor="middle">Shock, Chill, Ignite: a damaging skill of that element,</text><text x="290.8" y="1422.4" text-anchor="middle">or an attack build&#x27;s main-hand weapon</text><text x="290.8" y="1442.4" text-anchor="middle">A &#x27;cannot …&#x27; line rules it out for its skill group. Exposure, Crit Recently</text><rect x="20.0" y="1496.0" width="541.6" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.8" y="1520.4" text-anchor="middle">Written as PoB&#x27;s XML: Build, Tree, Skills, Items, Config, Notes</text><rect x="20.0" y="1574.0" width="541.6" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.8" y="1598.4" text-anchor="middle">zlib → urlsafe base64</text><rect x="20.0" y="1652.0" width="541.6" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="290.8" y="1676.4" text-anchor="middle">Returns code, how_to_import, notes, not_exported, summary</text><text x="290.8" y="1696.4" text-anchor="middle">No file written, no request made</text>
<text x="593.6" y="535.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="298.8" y="578.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="298.8" y="1316.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="595.6" y="1284.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text>
</svg>
