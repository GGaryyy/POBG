<svg xmlns="http://www.w3.org/2000/svg" width="951" height="1632" viewBox="0 0 951 1632" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>What export_pob works out</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="950" height="1631" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="313.1,80.0 313.1,118.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="313.1,178.0 313.1,236.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="606.3,256.0 670.3,256.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="313.1,276.0 313.1,334.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="606.3,384.0 800.8,384.0 800.8,296.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="313.1,434.0 313.1,482.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="606.3,502.0 670.3,502.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="313.1,522.0 313.1,570.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="800.8,532.0 800.8,678.0 606.3,678.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="313.1,610.0 313.1,648.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="313.1,708.0 313.1,746.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="313.1,846.0 313.1,884.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="313.1,944.0 313.1,982.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="313.1,1122.0 313.1,1160.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="313.1,1200.0 313.1,1238.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="606.3,1180.0 632.3,1180.0 632.3,1416.0 606.3,1416.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="313.1,1358.0 313.1,1396.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="313.1,1436.0 313.1,1474.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="313.1,1514.0 313.1,1552.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="20.0" width="586.3" height="60.0" rx="22.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="313.1" y="44.4" text-anchor="middle">export_pob input: class or ascendancy, targets, skill groups, gear</text><text x="313.1" y="64.4" text-anchor="middle">Optional: character_level, attribute, config</text><rect x="20.0" y="118.0" width="586.3" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="313.1" y="142.4" text-anchor="middle">Passive route: path_to</text><text x="313.1" y="162.4" text-anchor="middle">An ascendancy PoB has no id for is dropped and the route is made again</text><rect x="20.0" y="236.0" width="586.3" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="313.1" y="260.4" text-anchor="middle">Skill groups: each name is checked. A support must be able to support the skill</text><rect x="670.3" y="216.0" width="261.0" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="800.8" y="240.4" text-anchor="middle">Names, supports and modifiers</text><text x="800.8" y="260.4" text-anchor="middle">that fail stay out of the code</text><text x="800.8" y="280.4" text-anchor="middle">and are listed in not_exported</text><rect x="20.0" y="334.0" width="586.3" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="313.1" y="358.4" text-anchor="middle">Gear: bases and uniques against the local data</text><text x="313.1" y="378.4" text-anchor="middle">A rare&#x27;s modifiers must be whole modifiers the item class can roll:</text><text x="313.1" y="398.4" text-anchor="middle">3 prefixes + 3 suffixes, one per family</text><text x="313.1" y="418.4" text-anchor="middle">Values at the upper end of the best tier. Off-hand rules follow PoB</text><polygon points="34.0,482.0 592.3,482.0 606.3,502.0 592.3,522.0 34.0,522.0 20.0,502.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="313.1" y="506.4" text-anchor="middle">Was character_level given?</text><rect x="670.3" y="472.0" width="261.0" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="800.8" y="496.4" text-anchor="middle">Use that level, with a note when</text><text x="800.8" y="516.4" text-anchor="middle">the points need a higher one</text><rect x="20.0" y="570.0" width="586.3" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="313.1" y="594.4" text-anchor="middle">Points spent → PoB&#x27;s level formula and act table (123 points is level 100)</text><rect x="20.0" y="648.0" width="586.3" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="313.1" y="672.4" text-anchor="middle">Gem levels: the highest level-table row the character level allows, at most 20</text><text x="313.1" y="692.4" text-anchor="middle">Support gems have no level</text><rect x="20.0" y="746.0" width="586.3" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="313.1" y="770.4" text-anchor="middle">Attributes</text><text x="313.1" y="790.4" text-anchor="middle">need = the highest of: each skill gem&#x27;s requirement,</text><text x="313.1" y="810.4" text-anchor="middle">the supports&#x27; +N summed, the highest gear requirement</text><text x="313.1" y="830.4" text-anchor="middle">have = class base + fixed attributes on passives and gear</text><rect x="20.0" y="884.0" width="586.3" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="313.1" y="908.4" text-anchor="middle">Attribute passives on the route cover the requirements first,</text><text x="313.1" y="928.4" text-anchor="middle">or follow attribute</text><rect x="20.0" y="982.0" width="586.3" height="140.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="313.1" y="1006.4" text-anchor="middle">Spirit</text><text x="313.1" y="1026.4" text-anchor="middle">need = (persistent skill&#x27;s reservation +</text><text x="313.1" y="1046.4" text-anchor="middle">supports&#x27; extra) × reservation multipliers</text><text x="313.1" y="1066.4" text-anchor="middle">have = every Spirit quest reward + a sceptre&#x27;s</text><text x="313.1" y="1086.4" text-anchor="middle">base Spirit + fixed Spirit on gear and passives</text><text x="313.1" y="1106.4" text-anchor="middle">Range-only or missing reservations are listed in unknown</text><polygon points="34.0,1160.0 592.3,1160.0 606.3,1180.0 592.3,1200.0 34.0,1200.0 20.0,1180.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="313.1" y="1184.4" text-anchor="middle">Is config on? (on by default)</text><rect x="20.0" y="1238.0" width="586.3" height="120.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="313.1" y="1262.4" text-anchor="middle">Each option needs evidence in the build</text><text x="313.1" y="1282.4" text-anchor="middle">Charges it gains. Enemy states it inflicts</text><text x="313.1" y="1302.4" text-anchor="middle">Shock, Chill, Ignite: a damaging skill of that element,</text><text x="313.1" y="1322.4" text-anchor="middle">or an attack build&#x27;s main-hand weapon</text><text x="313.1" y="1342.4" text-anchor="middle">A &#x27;cannot …&#x27; line rules it out for its skill group. Exposure, Crit Recently</text><rect x="20.0" y="1396.0" width="586.3" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="313.1" y="1420.4" text-anchor="middle">Written as PoB&#x27;s XML: Build, Tree, Skills, Items, Config, Notes</text><rect x="20.0" y="1474.0" width="586.3" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="313.1" y="1498.4" text-anchor="middle">zlib → urlsafe base64</text><rect x="20.0" y="1552.0" width="586.3" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="313.1" y="1576.4" text-anchor="middle">Returns code, how_to_import, notes, not_exported, summary</text><text x="313.1" y="1596.4" text-anchor="middle">No file written, no request made</text>
<text x="638.3" y="495.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="321.1" y="538.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="321.1" y="1216.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="640.3" y="1184.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text>
</svg>
