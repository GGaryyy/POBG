<svg xmlns="http://www.w3.org/2000/svg" width="969" height="1692" viewBox="0 0 969 1692" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:poe2-advisor：有出處的流派回答</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="968" height="1691" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="298.0,60.0 298.0,98.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="298.0,198.0 298.0,236.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="298.0,336.0 298.0,374.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="298.0,454.0 298.0,492.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="298.0,572.0 298.0,630.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="576.0,650.0 669.0,650.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="808.8,610.0 808.8,532.0 576.0,532.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="298.0,670.0 298.0,728.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="298.0,808.0 298.0,846.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="576.0,866.0 669.0,866.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="808.8,846.0 808.8,768.0 576.0,768.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="298.0,886.0 298.0,924.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="298.0,1004.0 298.0,1042.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="298.0,1162.0 298.0,1200.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="298.0,1240.0 298.0,1278.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="298.0,1378.0 298.0,1436.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="576.0,1456.0 669.0,1456.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="808.8,1416.0 808.8,1328.0 576.0,1328.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="298.0,1476.0 298.0,1534.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="298.0,1594.0 298.0,1632.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="20.0" width="556.0" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="298.0" y="44.4" text-anchor="middle">玩家要一個流派</text><rect x="20.0" y="98.0" width="556.0" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="298.0" y="122.4" text-anchor="middle">套用流程：poe2-advisor skill、build_guide prompt 或 build_workflow 工具</text><text x="298.0" y="142.4" text-anchor="middle">決定目標：預設是打通章節的流派，</text><text x="298.0" y="162.4" text-anchor="middle">先呼叫 campaign_stages 取得每個階段的上限</text><text x="298.0" y="182.4" text-anchor="middle">指定的等級高於章節結束，或說要輿圖／後期時，才做終局流派</text><rect x="20.0" y="236.0" width="556.0" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="298.0" y="260.4" text-anchor="middle">步驟 2：由資料找候選。每個選擇都要有資料上的理由，不能是「天梯都在用」</text><text x="298.0" y="280.4" text-anchor="middle">lookup_entity、gems_by、supports_for、</text><text x="298.0" y="300.4" text-anchor="middle">passives_with_stat、get_gem、get_passive</text><text x="298.0" y="320.4" text-anchor="middle">章節流派：先排最後階段，再往前排各階段；以階段等級當 max_level 篩選</text><rect x="20.0" y="374.0" width="556.0" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="298.0" y="398.4" text-anchor="middle">裝備：items_by、get_item 選基底或傳奇，modifiers_for 選目標詞綴</text><text x="298.0" y="418.4" text-anchor="middle">每件最多 3 條前綴 + 3 條後綴，依重要性排列；</text><text x="298.0" y="438.4" text-anchor="middle">章節流派每個技能最多該階段的輔助插槽數</text><rect x="20.0" y="492.0" width="556.0" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="298.0" y="516.4" text-anchor="middle">步驟 3：verify_build</text><text x="298.0" y="536.4" text-anchor="middle">一次送出所有寶石、天賦、裝備與目標詞綴</text><text x="298.0" y="556.4" text-anchor="middle">章節流派加上最後階段的 character_level：too_early 的拿掉或移到之後的階段</text><polygon points="34.0,630.0 562.0,630.0 576.0,650.0 562.0,670.0 34.0,670.0 20.0,650.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="298.0" y="654.4" text-anchor="middle">有 unverified 的名稱？</text><rect x="669.0" y="610.0" width="279.5" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="808.8" y="634.4" text-anchor="middle">步驟 4（最多兩輪）</text><text x="808.8" y="654.4" text-anchor="middle">刪除該名稱，或用 suggestions、</text><text x="808.8" y="674.4" text-anchor="middle">重新搜尋取代</text><rect x="20.0" y="728.0" width="556.0" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="298.0" y="752.4" text-anchor="middle">步驟 5：path_to</text><text x="298.0" y="772.4" text-anchor="middle">職業或昇華 + 已驗證的天賦 → 路線、順序、點數</text><text x="298.0" y="792.4" text-anchor="middle">章節流派：天賦依重要性排列並傳 by_stage=true → 每個階段點到哪</text><polygon points="34.0,846.0 562.0,846.0 576.0,866.0 562.0,886.0 34.0,886.0 20.0,866.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="298.0" y="870.4" text-anchor="middle">over：超過 123 點或昇華 8 點？</text><rect x="669.0" y="846.0" width="279.5" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="808.8" y="870.4" text-anchor="middle">拿掉 added_points 最大的天賦</text><rect x="20.0" y="924.0" width="556.0" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="298.0" y="948.4" text-anchor="middle">步驟 6：reference_builds</text><text x="298.0" y="968.4" text-anchor="middle">讀天梯快照，只用來說明與主流的差異；不含角色名稱</text><text x="298.0" y="988.4" text-anchor="middle">章節流派只比較主技能與昇華；天梯沒有資料時照實說</text><rect x="20.0" y="1042.0" width="556.0" height="120.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="298.0" y="1066.4" text-anchor="middle">步驟 7：撰寫回答</text><text x="298.0" y="1086.4" text-anchor="middle">數字、消耗、標籤、效果只用 verified 的事實</text><text x="298.0" y="1106.4" text-anchor="middle">目標詞綴是要找的目標；不計算傷害</text><text x="298.0" y="1126.4" text-anchor="middle">章節流派每階段一段：等級與點數、技能、</text><text x="298.0" y="1146.4" text-anchor="middle">天賦、裝備、精魂與昇華、任務獎勵與頭目</text><rect x="20.0" y="1200.0" width="556.0" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="298.0" y="1224.4" text-anchor="middle">步驟 8：結尾附上 sources_markdown，原樣貼上（內含被移除的名稱）</text><rect x="20.0" y="1278.0" width="556.0" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="298.0" y="1302.4" text-anchor="middle">步驟 9：export_pob</text><text x="298.0" y="1322.4" text-anchor="middle">職業、targets、技能組、裝備</text><text x="298.0" y="1342.4" text-anchor="middle">章節流派傳 stage（最後階段）：匯入碼含每階段一個天賦樹；</text><text x="298.0" y="1362.4" text-anchor="middle">終局流派指定等級時傳 character_level</text><polygon points="34.0,1436.0 562.0,1436.0 576.0,1456.0 562.0,1476.0 34.0,1476.0 20.0,1456.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="298.0" y="1460.4" text-anchor="middle">屬性或精魂的 need 大於 have？</text><rect x="669.0" y="1416.0" width="279.5" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="808.8" y="1440.4" text-anchor="middle">換寶石、</text><text x="808.8" y="1460.4" text-anchor="middle">減少常駐技能或保留精魂的輔助寶石，</text><text x="808.8" y="1480.4" text-anchor="middle">或在裝備加上屬性、精魂詞綴</text><rect x="20.0" y="1534.0" width="556.0" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="298.0" y="1558.4" text-anchor="middle">回答附上：匯入碼、how_to_import、notes、not_exported、</text><text x="298.0" y="1578.4" text-anchor="middle">屬性與精魂的已有／需求、PoB 配置選項與各自的依據</text><rect x="20.0" y="1632.0" width="556.0" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="298.0" y="1656.4" text-anchor="middle">玩家把匯入碼貼進 PoB：匯入/匯出 → 貼上 → 匯入</text>
<text x="622.5" y="643.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">有</text><text x="306.0" y="686.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">沒有，或已修兩輪（仍未通過的捨棄）</text><text x="622.5" y="859.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="306.0" y="902.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="622.5" y="1449.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是，可以修</text><text x="306.0" y="1492.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否；修不了就明白說出缺什麼</text>
</svg>
