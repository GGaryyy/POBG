<svg xmlns="http://www.w3.org/2000/svg" width="953" height="1752" viewBox="0 0 953 1752" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:poe2-advisor：有出處的流派回答</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="952" height="1751" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="290.1,60.0 290.1,98.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,198.0 290.1,236.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,336.0 290.1,374.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,454.0 290.1,492.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,592.0 290.1,650.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="560.3,670.0 653.3,670.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="793.0,630.0 793.0,542.0 560.3,542.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,690.0 290.1,748.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,828.0 290.1,866.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="560.3,886.0 653.3,886.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="793.0,866.0 793.0,788.0 560.3,788.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,906.0 290.1,944.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,1024.0 290.1,1062.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,1222.0 290.1,1260.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,1300.0 290.1,1338.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,1438.0 290.1,1496.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="560.3,1516.0 653.3,1516.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="793.0,1476.0 793.0,1388.0 560.3,1388.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,1536.0 290.1,1594.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,1654.0 290.1,1692.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="20.0" width="540.3" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="290.1" y="44.4" text-anchor="middle">玩家要一個流派</text><rect x="20.0" y="98.0" width="540.3" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="122.4" text-anchor="middle">套用流程：poe2-advisor skill、build_guide prompt 或 build_workflow 工具</text><text x="290.1" y="142.4" text-anchor="middle">決定目標：預設是打通章節、再打到 T16 地圖的分階段流派，</text><text x="290.1" y="162.4" text-anchor="middle">先呼叫 campaign_stages 取得每個階段的上限</text><text x="290.1" y="182.4" text-anchor="middle">只要章節時只排章節；指定的等級高於 T16，或要後期成品時，才做終局流派</text><rect x="20.0" y="236.0" width="540.3" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="260.4" text-anchor="middle">步驟 2：由資料找候選。每個選擇都要有資料上的理由，不能是「天梯都在用」</text><text x="290.1" y="280.4" text-anchor="middle">lookup_entity、gems_by、supports_for、</text><text x="290.1" y="300.4" text-anchor="middle">passives_with_stat、get_gem、get_passive</text><text x="290.1" y="320.4" text-anchor="middle">分階段流派：先排最後階段，再往前排各階段；以階段等級當 max_level 篩選</text><rect x="20.0" y="374.0" width="540.3" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="398.4" text-anchor="middle">裝備：items_by、get_item 選基底或傳奇，modifiers_for 選目標詞綴</text><text x="290.1" y="418.4" text-anchor="middle">每件最多 3 條前綴 + 3 條後綴，依重要性排列；</text><text x="290.1" y="438.4" text-anchor="middle">分階段流派每個技能最多該階段的輔助插槽數</text><rect x="20.0" y="492.0" width="540.3" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="516.4" text-anchor="middle">步驟 3：verify_build</text><text x="290.1" y="536.4" text-anchor="middle">一次送出所有寶石、天賦、裝備與目標詞綴</text><text x="290.1" y="556.4" text-anchor="middle">分階段流派加上最後階段的 character_level：</text><text x="290.1" y="576.4" text-anchor="middle">too_early 的拿掉或移到之後的階段</text><polygon points="34.0,650.0 546.3,650.0 560.3,670.0 546.3,690.0 34.0,690.0 20.0,670.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="290.1" y="674.4" text-anchor="middle">有 unverified 的名稱？</text><rect x="653.3" y="630.0" width="279.5" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="793.0" y="654.4" text-anchor="middle">步驟 4（最多兩輪）</text><text x="793.0" y="674.4" text-anchor="middle">刪除該名稱，或用 suggestions、</text><text x="793.0" y="694.4" text-anchor="middle">重新搜尋取代</text><rect x="20.0" y="748.0" width="540.3" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="772.4" text-anchor="middle">步驟 5：path_to</text><text x="290.1" y="792.4" text-anchor="middle">職業或昇華 + 已驗證的天賦 → 路線、順序、點數</text><text x="290.1" y="812.4" text-anchor="middle">分階段流派：天賦依重要性排列並傳 by_stage=true → 每個階段點到哪</text><polygon points="34.0,866.0 546.3,866.0 560.3,886.0 546.3,906.0 34.0,906.0 20.0,886.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="290.1" y="890.4" text-anchor="middle">over：超過 123 點或昇華 8 點？</text><rect x="653.3" y="866.0" width="279.5" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="793.0" y="890.4" text-anchor="middle">拿掉 added_points 最大的天賦</text><rect x="20.0" y="944.0" width="540.3" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="968.4" text-anchor="middle">步驟 6：reference_builds</text><text x="290.1" y="988.4" text-anchor="middle">讀天梯快照，只用來說明與主流的差異；不含角色名稱</text><text x="290.1" y="1008.4" text-anchor="middle">章節與前段地圖只比較主技能與昇華，T16 完整比較；天梯沒有資料時照實說</text><rect x="20.0" y="1062.0" width="540.3" height="160.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="1086.4" text-anchor="middle">步驟 7：撰寫回答</text><text x="290.1" y="1106.4" text-anchor="middle">數字、消耗、標籤、效果只用 verified 的事實</text><text x="290.1" y="1126.4" text-anchor="middle">目標詞綴是要找的目標；不計算傷害</text><text x="290.1" y="1146.4" text-anchor="middle">分階段流派每階段一段：等級與點數、技能、天賦、</text><text x="290.1" y="1166.4" text-anchor="middle">裝備、精魂與昇華、抗性懲罰、章節的任務獎勵與頭目</text><text x="290.1" y="1186.4" text-anchor="middle">每個裝備部位一串 search_string；</text><text x="290.1" y="1206.4" text-anchor="middle">地圖階段用 waystone_mods 找剋制流派的詞綴，附排除它們的搜尋字串</text><rect x="20.0" y="1260.0" width="540.3" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="1284.4" text-anchor="middle">步驟 8：結尾附上 sources_markdown，原樣貼上（內含被移除的名稱）</text><rect x="20.0" y="1338.0" width="540.3" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="1362.4" text-anchor="middle">步驟 9：export_pob</text><text x="290.1" y="1382.4" text-anchor="middle">職業、targets、技能組、裝備</text><text x="290.1" y="1402.4" text-anchor="middle">分階段流派傳 stage（最後階段，通常是 maps_t16）：</text><text x="290.1" y="1422.4" text-anchor="middle">匯入碼含每階段一個天賦樹；終局流派指定等級時傳 character_level</text><polygon points="34.0,1496.0 546.3,1496.0 560.3,1516.0 546.3,1536.0 34.0,1536.0 20.0,1516.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="290.1" y="1520.4" text-anchor="middle">屬性或精魂的 need 大於 have？</text><rect x="653.3" y="1476.0" width="279.5" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="793.0" y="1500.4" text-anchor="middle">換寶石、</text><text x="793.0" y="1520.4" text-anchor="middle">減少常駐技能或保留精魂的輔助寶石，</text><text x="793.0" y="1540.4" text-anchor="middle">或在裝備加上屬性、精魂詞綴</text><rect x="20.0" y="1594.0" width="540.3" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="1618.4" text-anchor="middle">回答附上：匯入碼、how_to_import、notes、not_exported、</text><text x="290.1" y="1638.4" text-anchor="middle">屬性與精魂的已有／需求、PoB 配置選項與各自的依據</text><rect x="20.0" y="1692.0" width="540.3" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="290.1" y="1716.4" text-anchor="middle">玩家把匯入碼貼進 PoB：匯入/匯出 → 貼上 → 匯入</text>
<text x="606.8" y="663.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">有</text><text x="298.1" y="706.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">沒有，或已修兩輪（仍未通過的捨棄）</text><text x="606.8" y="879.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="298.1" y="922.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="606.8" y="1509.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是，可以修</text><text x="298.1" y="1552.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否；修不了就明白說出缺什麼</text>
</svg>
