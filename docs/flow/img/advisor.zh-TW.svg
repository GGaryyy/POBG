<svg xmlns="http://www.w3.org/2000/svg" width="953" height="1452" viewBox="0 0 953 1452" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:poe2-advisor：有出處的流派回答</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="952" height="1451" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="290.1,60.0 290.1,98.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,138.0 290.1,176.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,256.0 290.1,294.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,354.0 290.1,392.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,452.0 290.1,510.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="560.3,530.0 653.3,530.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="793.0,490.0 793.0,422.0 560.3,422.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,550.0 290.1,608.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,668.0 290.1,706.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="560.3,726.0 653.3,726.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="793.0,706.0 793.0,638.0 560.3,638.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,746.0 290.1,784.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,844.0 290.1,882.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,962.0 290.1,1000.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,1040.0 290.1,1078.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,1138.0 290.1,1196.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="560.3,1216.0 653.3,1216.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="793.0,1176.0 793.0,1108.0 560.3,1108.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,1236.0 290.1,1294.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="290.1,1354.0 290.1,1392.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="20.0" width="540.3" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="290.1" y="44.4" text-anchor="middle">玩家要一個流派</text><rect x="20.0" y="98.0" width="540.3" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="122.4" text-anchor="middle">套用流程：poe2-advisor skill、build_guide prompt 或 build_workflow 工具</text><rect x="20.0" y="176.0" width="540.3" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="200.4" text-anchor="middle">步驟 2：由資料找候選。每個選擇都要有資料上的理由，不能是「天梯都在用」</text><text x="290.1" y="220.4" text-anchor="middle">lookup_entity、gems_by、supports_for、</text><text x="290.1" y="240.4" text-anchor="middle">passives_with_stat、get_gem、get_passive</text><rect x="20.0" y="294.0" width="540.3" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="318.4" text-anchor="middle">裝備：items_by、get_item 選基底或傳奇，modifiers_for 選目標詞綴</text><text x="290.1" y="338.4" text-anchor="middle">每件最多 3 條前綴 + 3 條後綴，依重要性排列</text><rect x="20.0" y="392.0" width="540.3" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="416.4" text-anchor="middle">步驟 3：verify_build</text><text x="290.1" y="436.4" text-anchor="middle">一次送出所有寶石、天賦、裝備與目標詞綴</text><polygon points="34.0,510.0 546.3,510.0 560.3,530.0 546.3,550.0 34.0,550.0 20.0,530.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="290.1" y="534.4" text-anchor="middle">有 unverified 的名稱？</text><rect x="653.3" y="490.0" width="279.5" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="793.0" y="514.4" text-anchor="middle">步驟 4（最多兩輪）</text><text x="793.0" y="534.4" text-anchor="middle">刪除該名稱，或用 suggestions、</text><text x="793.0" y="554.4" text-anchor="middle">重新搜尋取代</text><rect x="20.0" y="608.0" width="540.3" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="632.4" text-anchor="middle">步驟 5：path_to</text><text x="290.1" y="652.4" text-anchor="middle">職業或昇華 + 已驗證的天賦 → 路線、順序、點數</text><polygon points="34.0,706.0 546.3,706.0 560.3,726.0 546.3,746.0 34.0,746.0 20.0,726.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="290.1" y="730.4" text-anchor="middle">over：超過 123 點或昇華 8 點？</text><rect x="653.3" y="706.0" width="279.5" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="793.0" y="730.4" text-anchor="middle">拿掉 added_points 最大的天賦</text><rect x="20.0" y="784.0" width="540.3" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="808.4" text-anchor="middle">步驟 6：reference_builds</text><text x="290.1" y="828.4" text-anchor="middle">讀天梯快照，只用來說明與主流的差異；不含角色名稱</text><rect x="20.0" y="882.0" width="540.3" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="906.4" text-anchor="middle">步驟 7：撰寫回答</text><text x="290.1" y="926.4" text-anchor="middle">數字、消耗、標籤、效果只用 verified 的事實</text><text x="290.1" y="946.4" text-anchor="middle">目標詞綴是要找的目標；不計算傷害</text><rect x="20.0" y="1000.0" width="540.3" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="1024.4" text-anchor="middle">步驟 8：結尾附上 sources_markdown，原樣貼上（內含被移除的名稱）</text><rect x="20.0" y="1078.0" width="540.3" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="1102.4" text-anchor="middle">步驟 9：export_pob</text><text x="290.1" y="1122.4" text-anchor="middle">職業、targets、技能組、裝備；使用者指定等級時傳入 character_level</text><polygon points="34.0,1196.0 546.3,1196.0 560.3,1216.0 546.3,1236.0 34.0,1236.0 20.0,1216.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="290.1" y="1220.4" text-anchor="middle">屬性或精魂的 need 大於 have？</text><rect x="653.3" y="1176.0" width="279.5" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="793.0" y="1200.4" text-anchor="middle">換寶石、</text><text x="793.0" y="1220.4" text-anchor="middle">減少常駐技能或保留精魂的輔助寶石，</text><text x="793.0" y="1240.4" text-anchor="middle">或在裝備加上屬性、精魂詞綴</text><rect x="20.0" y="1294.0" width="540.3" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="290.1" y="1318.4" text-anchor="middle">回答附上：匯入碼、how_to_import、notes、not_exported、</text><text x="290.1" y="1338.4" text-anchor="middle">屬性與精魂的已有／需求、PoB 配置選項與各自的依據</text><rect x="20.0" y="1392.0" width="540.3" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="290.1" y="1416.4" text-anchor="middle">玩家把匯入碼貼進 PoB：匯入/匯出 → 貼上 → 匯入</text>
<text x="606.8" y="523.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">有</text><text x="298.1" y="566.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">沒有，或已修兩輪（仍未通過的捨棄）</text><text x="606.8" y="719.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="298.1" y="762.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="606.8" y="1209.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是，可以修</text><text x="298.1" y="1252.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否；修不了就明白說出缺什麼</text>
</svg>
