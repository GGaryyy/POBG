<svg xmlns="http://www.w3.org/2000/svg" width="847" height="1510" viewBox="0 0 847 1510" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:update-pob：更新你的 Path of Building</title>
