.0 244.6,1088.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="469.1,1108.0 533.1,1108.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="244.6,1128.0 244.6,1176.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="244.6,1216.0 244.6,1254.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="244.6,1314.0 244.6,1352.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="244.6,1392.0 244.6,1430.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="20.0" width="449.1" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="244.6" y="44.4" text-anchor="middle">/pobg:update-pob 資料夾</text><polygon points="34.0,98.0 455.1,98.0 469.1,118.0 455.1,138.0 34.0,138.0 20.0,118.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="244.6" y="122.4" text-anchor="middle">有給資料夾嗎？</text><rect x="533.1" y="98.0" width="294.1" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="680.2" y="122.4" text-anchor="middle">請使用者提供後停止；不會搜尋硬碟</text><polygon points="34.0,186.0 455.1,186.0 469.1,206.0 455.1,226.0 34.0,226.0 20.0,206.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="244.6" y="210.4" text-anchor="middle">路徑含有雙引號、反引號或錢字號？</text><rect x="533.1" y="176.0" width="294.1" height="60.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="680.2" y="200.4" text-anchor="middle">不執行任何東西</text><text x="680.2" y="220.4" text-anchor="middle">請使用者改資料夾名稱，或自己執行指令</text><rect x="20.0" y="274.0" width="449.1" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="244.6" y="298.4" text-anchor="middle">第一步：加 --check 執行</text><text x="244.6" y="318.4" text-anchor="middle">2 個請求到 GitHub，不寫入</text><rect x="20.0" y="372.0" width="449.1" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="244.6" y="396.4" text-anchor="middle">辨識資料夾</text><text x="244.6" y="416.4" text-anchor="middle">有 manifest.xml：單獨的 Path of Building</text><text x="244.6" y="436.4" text-anchor="middle">有 PoeCharm3.exe：PoeCharm2，PoB 在裡面</text><rect x="20.0" y="490.0" width="449.1" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="244.6" y="514.4" text-anchor="middle">回報 installed 與 latest</text><text x="244.6" y="534.4" text-anchor="middle">PoeCharm2 另回報最新提交與日期</text><polygon points="34.0,588.0 455.1,588.0 469.1,608.0 455.1,628.0 34.0,628.0 20.0,608.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="244.6" y="612.4" text-anchor="middle">up_to_date？</text><rect x="533.1" y="588.0" width="294.1" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="680.2" y="612.4" text-anchor="middle">已是最新，結束</text><rect x="20.0" y="666.0" width="449.1" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="244.6" y="690.4" text-anchor="middle">說明更新會做什麼</text><text x="244.6" y="710.4" text-anchor="middle">下載 PoB 正式版（約 380 MB）並核對 SHA-256</text><text x="244.6" y="730.4" text-anchor="middle">PoeCharm2 另下載約 30 MB，沒有公布的雜湊可核對</text><text x="244.6" y="750.4" text-anchor="middle">解壓到舊資料夾旁的新資料夾</text><polygon points="34.0,804.0 455.1,804.0 469.1,824.0 455.1,844.0 34.0,844.0 20.0,824.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="244.6" y="828.4" text-anchor="middle">使用者同意？</text><rect x="533.1" y="804.0" width="294.1" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="680.2" y="828.4" text-anchor="middle">結束，什麼都沒下載</text><rect x="20.0" y="882.0" width="449.1" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="244.6" y="906.4" text-anchor="middle">第二步：不加 --check 執行</text><text x="244.6" y="926.4" text-anchor="middle">可能要幾分鐘，逾時設 10 分鐘</text><rect x="20.0" y="980.0" width="449.1" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="244.6" y="1004.4" text-anchor="middle">下載到暫存工作資料夾</text><text x="244.6" y="1024.4" text-anchor="middle">PoB 不得超過公布的大小，PoeCharm2 上限 200 MB</text><polygon points="34.0,1088.0 455.1,1088.0 469.1,1108.0 455.1,1128.0 34.0,1128.0 20.0,1108.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="244.6" y="1112.4" text-anchor="middle">SHA-256 與 GitHub 公布的相符？</text><rect x="533.1" y="1078.0" width="294.1" height="60.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="680.2" y="1102.4" text-anchor="middle">報錯並清掉暫存</text><text x="680.2" y="1122.4" text-anchor="middle">舊資料夾不變</text><rect x="20.0" y="1176.0" width="449.1" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="244.6" y="1200.4" text-anchor="middle">解壓：拒絕會跳出目錄的路徑，限制解壓後的大小</text><rect x="20.0" y="1254.0" width="449.1" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="244.6" y="1278.4" text-anchor="middle">複製存過的 build（Builds）與 PoeCharm2 的語言設定</text><text x="244.6" y="1298.4" text-anchor="middle">不讀也不複製 Settings.xml</text><rect x="20.0" y="1352.0" width="449.1" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="244.6" y="1376.4" text-anchor="middle">改名成新資料夾；防毒掃描擋住時重試 5 次</text><rect x="20.0" y="1430.0" width="449.1" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="244.6" y="1454.4" text-anchor="middle">回報 new_folder、version、builds_copied、checksum、next</text><text x="244.6" y="1474.4" text-anchor="middle">舊資料夾不修改、不刪除；要重新登入</text>
<text x="501.1" y="111.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">沒有</text><text x="252.6" y="154.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">有</text><text x="501.1" y="199.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="252.6" y="242.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="501.1" y="601.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="252.6" y="644.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="501.1" y="817.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="252.6" y="860.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="501.1" y="1101.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="252.6" y="1144.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text>
</svg>
