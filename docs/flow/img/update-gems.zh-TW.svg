w)"/><polyline points="338.4,882.0 338.4,920.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="73.0" y="20.0" width="530.8" height="60.0" rx="22.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="338.4" y="44.4" text-anchor="middle">範圍是 skill_gems、spirit_gems 或 support_gems</text><text x="338.4" y="64.4" text-anchor="middle">可加寶石名稱，或「超過 N 天」</text><rect x="73.0" y="118.0" width="530.8" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="338.4" y="142.4" text-anchor="middle">update_data dry_run=true：抓列表頁，1 個請求</text><rect x="73.0" y="196.0" width="530.8" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="338.4" y="220.4" text-anchor="middle">挑出要抓的寶石：新增的、列表上有變動的、指定名稱的、超過 N 天沒更新的</text><text x="338.4" y="240.4" text-anchor="middle">15 分鐘內抓過的寶石不再抓</text><rect x="73.0" y="294.0" width="530.8" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="338.4" y="318.4" text-anchor="middle">告訴使用者：selected、reasons、added、removed</text><polygon points="87.0,372.0 589.8,372.0 603.8,392.0 589.8,412.0 87.0,412.0 73.0,392.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="338.4" y="396.4" text-anchor="middle">selected 等於 0？</text><rect x="667.8" y="372.0" width="250.4" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="793.0" y="396.4" text-anchor="middle">這類資料已是最新，結束</text><polygon points="87.0,460.0 589.8,460.0 603.8,480.0 589.8,500.0 87.0,500.0 73.0,480.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="338.4" y="484.4" text-anchor="middle">selected 超過 60？</text><rect x="667.8" y="450.0" width="250.4" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="793.0" y="474.4" text-anchor="middle">請使用者確認：每顆寶石一個請求</text><text x="793.0" y="494.4" text-anchor="middle">不同意就結束，不寫入</text><rect x="73.0" y="548.0" width="530.8" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="338.4" y="572.4" text-anchor="middle">update_data dry_run=false</text><text x="338.4" y="592.4" text-anchor="middle">每次最多 20 顆（上限 40），每頁間隔 0.8 秒</text><polygon points="87.0,656.0 589.8,656.0 603.8,676.0 589.8,696.0 87.0,696.0 73.0,676.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="338.4" y="680.4" text-anchor="middle">頁面還能解析、驗證通過？</text><rect x="667.8" y="646.0" width="250.4" height="60.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="793.0" y="670.4" text-anchor="middle">中止，不寫入任何東西</text><text x="793.0" y="690.4" text-anchor="middle">建議用 status 檢查線上網站</text><rect x="73.0" y="744.0" width="530.8" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="338.4" y="768.4" text-anchor="middle">寫回該類寶石的資料檔</text><text x="338.4" y="788.4" text-anchor="middle">下載失敗的單一頁面列為 skipped，下次再抓</text><polygon points="87.0,842.0 589.8,842.0 603.8,862.0 589.8,882.0 87.0,882.0 73.0,862.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="338.4" y="866.4" text-anchor="middle">left 大於 0，且未滿 10 次呼叫？</text><rect x="73.0" y="920.0" width="530.8" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="338.4" y="944.4" text-anchor="middle">回報 updated、added、removed、skipped</text>
<text x="635.8" y="385.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="346.4" y="428.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="635.8" y="473.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="346.4" y="516.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="801.0" y="526.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">同意</text><text x="635.8" y="669.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="346.4" y="712.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="39.0" y="866.0" text-anchor="end" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="346.4" y="898.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text>
