<svg xmlns="http://www.w3.org/2000/svg" width="938" height="980" viewBox="0 0 938 980" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:update 三種寶石</title>
