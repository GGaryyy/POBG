<rect x="20.0" y="20.0" width="560.7" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="300.3" y="44.4" text-anchor="middle">The scope is campaign (no other argument)</text><rect x="20.0" y="98.0" width="560.7" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="300.3" y="122.4" text-anchor="middle">One call, about 26 requests, 0.8 s apart</text><text x="300.3" y="142.4" text-anchor="middle">poe2db&#x27;s Act pages (English and Chinese),</text><text x="300.3" y="162.4" text-anchor="middle">gem and Jeweller&#x27;s Orb pages, PoB&#x27;s quest rewards</text><rect x="20.0" y="216.0" width="560.7" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="300.3" y="240.4" text-anchor="middle">The Act pages the index lists: one without areas is not a stage</text><text x="300.3" y="260.4" text-anchor="middle">The Act page with the Interlude page&#x27;s areas is named Interlude</text><rect x="20.0" y="314.0" width="560.7" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="300.3" y="338.4" text-anchor="middle">Areas (level, bosses, map, walkthrough), quests,</text><text x="300.3" y="358.4" text-anchor="middle">permanent rewards placed by PoB&#x27;s description</text><text x="300.3" y="378.4" text-anchor="middle">Gem level table, drop levels of support gems and Jeweller&#x27;s Orbs</text><polygon points="34.0,432.0 566.7,432.0 580.7,472.0 566.7,512.0 34.0,512.0 20.0,472.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="300.3" y="456.4" text-anchor="middle">Above the minimums?</text><text x="300.3" y="476.4" text-anchor="middle">Stages, areas per stage, quests, gem levels,</text><text x="300.3" y="496.4" text-anchor="middle">support gem levels, the socket rule</text><rect x="644.7" y="452.0" width="229.0" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="759.2" y="476.4" text-anchor="middle">Refused. The old data stays</text><rect x="20.0" y="550.0" width="560.7" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="300.3" y="574.4" text-anchor="middle">Writes the four files of data/campaign and rebuilds the name index (areas,</text><text x="300.3" y="594.4" text-anchor="middle">quests, bosses)</text><rect x="20.0" y="648.0" width="560.7" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="300.3" y="672.4" text-anchor="middle">Report stages (and previous_stages when they changed), areas and quests</text>
<text x="612.7" y="465.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="308.3" y="528.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text>
</svg>
