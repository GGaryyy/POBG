<rect x="139.9" y="20.0" width="425.1" height="60.0" rx="22.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="352.5" y="44.4" text-anchor="middle">範圍是 items</text><text x="352.5" y="64.4" text-anchor="middle">可加裝備類別名稱，例如 Bows</text><rect x="139.9" y="118.0" width="425.1" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="352.5" y="142.4" text-anchor="middle">決定要抓的頁面</text><text x="352.5" y="162.4" text-anchor="middle">全部：69 個類別頁 × 中英 = 138 個請求</text><text x="352.5" y="182.4" text-anchor="middle">指定類別：只抓那幾類與其屬性子頁</text><rect x="139.9" y="236.0" width="425.1" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="352.5" y="260.4" text-anchor="middle">update_data：這次呼叫最多 20 個請求</text><text x="352.5" y="280.4" text-anchor="middle">（10 個類別頁的中英兩版，每頁約 600 KB）</text><rect x="139.9" y="334.0" width="425.1" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="352.5" y="358.4" text-anchor="middle">進度暫存在 output/cache 30 分鐘，中斷後接續而不是重來</text><polygon points="153.9,432.0 551.1,432.0 565.1,452.0 551.1,472.0 153.9,472.0 139.9,452.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="352.5" y="456.4" text-anchor="middle">done：全部頁面都抓到了？</text><rect x="673.0" y="412.0" width="246.0" height="80.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="796.0" y="436.4" text-anchor="middle">已滿 8 次呼叫：</text><text x="796.0" y="456.4" text-anchor="middle">請使用者 30 分鐘內再下一次指令</text><text x="796.0" y="476.4" text-anchor="middle">到此為止沒有寫入</text><rect x="139.9" y="530.0" width="425.1" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="352.5" y="554.4" text-anchor="middle">解析基底、傳奇與頁面內嵌的詞綴資料；中英對齊、計算階級</text><polygon points="153.9,608.0 551.1,608.0 565.1,628.0 551.1,648.0 153.9,648.0 139.9,628.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="352.5" y="632.4" text-anchor="middle">筆數與詞綴資料通過檢查？</text><rect x="673.0" y="608.0" 