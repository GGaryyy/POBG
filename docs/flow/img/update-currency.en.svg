<svg xmlns="http://www.w3.org/2000/svg" width="1028" height="1084" viewBox="0 0 1028 1084" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:update currency</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="1027" height="1083" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="373.7,120.0 373.7,158.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="373.7,278.0 373.7,316.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="373.7,376.0 373.7,414.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="373.7,474.0 373.7,532.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="579.0,552.0 712.2,552.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="168.4,552.0 142.4,552.0 142.4,346.0 168.4,346.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="373.7,572.0 373.7,630.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="373.7,750.0 373.7,788.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="579.0,828.0 712.2,828.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="373.7,868.0 373.7,906.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="373.7,966.0 373.7,1004.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="168.4" y="20.0" width="410.6" height="100.0" rx="22.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="373.7" y="44.4" text-anchor="middle">The scope is currency</text><text x="373.7" y="64.4" text-anchor="middle">Optionally older_than_days:</text><text x="373.7" y="84.4" text-anchor="middle">item pages read more than N days ago are read again,</text><text x="373.7" y="104.4" text-anchor="middle">0 for all</text><rect x="168.4" y="158.0" width="410.6" height="120.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="373.7" y="182.4" text-anchor="middle">Decide the pages</text><text x="373.7" y="202.4" text-anchor="middle">3 listing pages in two languages</text><text x="373.7" y="222.4" text-anchor="middle">= 6 requests (every time)</text><text x="373.7" y="242.4" text-anchor="middle">One request per item whose own page was not read</text><text x="373.7" y="262.4" text-anchor="middle">yet: about 620 the first time, then only new items</text><rect x="168.4" y="316.0" width="410.6" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="373.7" y="340.4" text-anchor="middle">update_data:</text><text x="373.7" y="360.4" text-anchor="middle">at most 50 requests this call, 0.8 s apart</text><rect x="168.4" y="414.0" width="410.6" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="373.7" y="438.4" text-anchor="middle">Progress is kept under output/cache for 30 minutes,</text><text x="373.7" y="458.4" text-anchor="middle">so an interrupted run continues</text><polygon points="182.4,532.0 565.0,532.0 579.0,552.0 565.0,572.0 182.4,572.0 168.4,552.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="373.7" y="556.4" text-anchor="middle">done: is every page fetched?</text><rect x="712.2" y="512.0" width="295.8" height="80.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="860.1" y="536.4" text-anchor="middle">16 calls made: ask the user to run</text><text x="860.1" y="556.4" text-anchor="middle">the command again within 30 minutes</text><text x="860.1" y="576.4" text-anchor="middle">Nothing written so far</text><rect x="168.4" y="630.0" width="410.6" height="120.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="373.7" y="654.4" text-anchor="middle">Listings: category (the English tab),</text><text x="373.7" y="674.4" text-anchor="middle">effects, stack size, minimum modifier level,</text><text x="373.7" y="694.4" text-anchor="middle">required level; Chinese joined by slug</text><text x="373.7" y="714.4" text-anchor="middle">Item pages: drop level, item class, tags;</text><text x="373.7" y="734.4" text-anchor="middle">empty when a page cannot be read</text><polygon points="182.4,788.0 565.0,788.0 579.0,828.0 565.0,868.0 182.4,868.0 168.4,828.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="373.7" y="812.4" text-anchor="middle">Above the minimums?</text><text x="373.7" y="832.4" text-anchor="middle">Total, per category, share with a Chinese name,</text><text x="373.7" y="852.4" text-anchor="middle">share with an item page read</text><rect x="712.2" y="808.0" width="295.8" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="860.1" y="832.4" text-anchor="middle">Refused. The old data stays</text><rect x="168.4" y="906.0" width="410.6" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="373.7" y="930.4" text-anchor="middle">Writes data/currency/currency.jsonl and</text><text x="373.7" y="950.4" text-anchor="middle">rebuilds the name index (currency items)</text><rect x="168.4" y="1004.0" width="410.6" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="373.7" y="1028.4" text-anchor="middle">Report records, categories,</text><text x="373.7" y="1048.4" text-anchor="middle">added, removed, item_pages_failed</text>
<text x="645.6" y="545.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no, 16 calls made</text><text x="134.4" y="556.0" text-anchor="end" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no, under 16 calls</text><text x="381.7" y="588.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="645.6" y="821.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="381.7" y="884.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text>
</svg>
