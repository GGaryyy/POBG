<rect x="20.0" y="20.0" width="533.9" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="286.9" y="44.4" text-anchor="middle">範圍是 campaign（不接受其他參數）</text><rect x="20.0" y="98.0" width="533.9" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="286.9" y="122.4" text-anchor="middle">一次呼叫，約 26 個請求，間隔 0.8 秒</text><text x="286.9" y="142.4" text-anchor="middle">poe2db 章節頁（中英）、寶石與工匠石頁、PoB 的任務獎勵</text><rect x="20.0" y="196.0" width="533.9" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="286.9" y="220.4" text-anchor="middle">章節索引頁列出的章節頁：沒有區域的不算階段</text><text x="286.9" y="240.4" text-anchor="middle">區域與插曲頁相同的章節頁命名為插曲</text><rect x="20.0" y="294.0" width="533.9" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="286.9" y="318.4" text-anchor="middle">區域（等級、頭目、地圖、攻略）、任務、永久獎勵依 PoB 的說明放進各階段</text><text x="286.9" y="338.4" text-anchor="middle">寶石等級表、輔助寶石與工匠石的掉落等級</text><polygon points="34.0,392.0 539.9,392.0 553.9,422.0 539.9,452.0 34.0,452.0 20.0,422.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="286.9" y="416.4" text-anchor="middle">達到下限？</text><text x="286.9" y="436.4" text-anchor="middle">階段數、每階段的區域、任務、寶石等級、輔助寶石等級、插槽規則</text><rect x="617.9" y="402.0" width="177.6" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="706.7" y="426.4" text-anchor="middle">拒絕寫入，保留舊資料</text><rect x="20.0" y="490.0" width="533.9" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="286.9" y="514.4" text-anchor="middle">寫入 data/campaign 的四個檔案，重建名稱索引（區域、任務、頭目）</text><rect x="20.0" y="568.0" width="533.9" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="286.9" y="592.4" text-anchor="middle">回報 stages（有變時 previous_stages）、areas、quests</text>
<text x="585.9" y="415.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="294.9" y="468.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text>
