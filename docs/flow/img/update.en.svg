<svg xmlns="http://www.w3.org/2000/svg" width="997" height="708" viewBox="0 0 997 708" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:update: the scope first</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="996" height="707" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="308.7,60.0 308.7,108.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="597.5,128.0 712.4,128.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="308.7,148.0 308.7,196.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="308.7,236.0 308.7,284.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="597.5,304.0 712.4,304.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="308.7,324.0 308.7,372.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="308.7,512.0 308.7,550.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="308.7,610.0 308.7,648.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="20.0" width="577.5" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="308.7" y="44.4" text-anchor="middle">/pobg:update scope [names]</text><polygon points="34.0,108.0 583.5,108.0 597.5,128.0 583.5,148.0 34.0,148.0 20.0,128.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="308.7" y="132.4" text-anchor="middle">Is the first word one of the seven scopes?</text><rect x="712.4" y="98.0" width="264.5" height="60.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="844.7" y="122.4" text-anchor="middle">update_data is not called.</text><text x="844.7" y="142.4" text-anchor="middle">The user is asked to pick a scope</text><rect x="20.0" y="196.0" width="577.5" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="308.7" y="220.4" text-anchor="middle">update_data: arguments are checked (at most 40 names)</text><polygon points="34.0,284.0 583.5,284.0 597.5,304.0 583.5,324.0 34.0,324.0 20.0,304.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="308.7" y="308.4" text-anchor="middle">Is an update, refresh or online check already running on this data folder?</text><rect x="712.4" y="274.0" width="264.5" height="60.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="844.7" y="298.4" text-anchor="middle">Reports busy, try again later.</text><text x="844.7" y="318.4" text-anchor="middle">Nothing written</text><rect x="20.0" y="372.0" width="577.5" height="140.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="36.0" y="396.4" text-anchor="start">The scope decides the flow (one chart each)</text><text x="36.0" y="416.4" text-anchor="start">skill_gems, spirit_gems, support_gems → gems</text><text x="36.0" y="436.4" text-anchor="start">passives → passive tree</text><text x="36.0" y="456.4" text-anchor="start">items → items</text><text x="36.0" y="476.4" text-anchor="start">glossary → glossary</text><text x="36.0" y="496.4" text-anchor="start">ninja → ladder (poe.ninja)</text><rect x="20.0" y="550.0" width="577.5" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="308.7" y="574.4" text-anchor="middle">After writing, the name index is rebuilt and</text><text x="308.7" y="594.4" text-anchor="middle">the server reloads the data outside the lock</text><rect x="20.0" y="648.0" width="577.5" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="308.7" y="672.4" text-anchor="middle">The same conversation sees the new data</text>
<text x="654.9" y="121.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no, or missing</text><text x="316.7" y="164.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="654.9" y="297.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="316.7" y="340.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text>
</svg>
