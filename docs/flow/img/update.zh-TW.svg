<rect x="20.0" y="20.0" width="420.4" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="230.2" y="44.4" text-anchor="middle">/pobg:update 範圍 [名稱]</text><polygon points="34.0,108.0 426.4,108.0 440.4,128.0 426.4,148.0 34.0,148.0 20.0,128.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="230.2" y="132.4" text-anchor="middle">第一個字是七個範圍之一嗎？</text><rect x="546.4" y="98.0" width="250.4" height="60.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="671.6" y="122.4" text-anchor="middle">不呼叫 update_data，</text><text x="671.6" y="142.4" text-anchor="middle">請使用者選一個範圍</text><rect x="20.0" y="196.0" width="420.4" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="230.2" y="220.4" text-anchor="middle">update_data：檢查參數（名稱最多 40 個）</text><polygon points="34.0,274.0 426.4,274.0 440.4,294.0 426.4,314.0 34.0,314.0 20.0,294.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="230.2" y="298.4" text-anchor="middle">同一個資料夾已有 update、refresh 或線上檢查在跑？</text><rect x="546.4" y="274.0" width="250.4" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="671.6" y="298.4" text-anchor="middle">回報忙碌中，請稍後再試；不寫入</text><rect x="20.0" y="352.0" width="420.4" height="140.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="36.0" y="376.4" text-anchor="start">依範圍進入對應的流程（各有一張圖）</text><text x="36.0" y="396.4" text-anchor="start">skill_gems、spirit_gems、support_gems → 寶石</text><text x="36.0" y="416.4" text-anchor="start">passives → 天賦樹</text><text x="36.0" y="436.4" text-anchor="start">items → 裝備</text><text x="36.0" y="456.4" text-anchor="start">glossary → 名詞解釋</text><text x="36.0" y="476.4" text-anchor="start">ladder → 天梯</text><rect x="20.0" y="530.0" width="420.4" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="230.2" y="554.4" text-anchor="middle">寫入後重建名稱索引；server 在鎖外重新載入資料</text><rect x="20.0" y="608.0" width="420.4" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="230.2" y="632.4" text-anchor="middle">同一個對話立刻看到新資料</text>
<text x="493.4" y="121.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">不是，或沒寫</text><text x="238.2" y="164.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="493.4" y="287.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="238.2" y="330.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text>
