<svg xmlns="http://www.w3.org/2000/svg" width="817" height="668" viewBox="0 0 817 668" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
