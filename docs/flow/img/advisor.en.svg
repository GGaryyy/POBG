<svg xmlns="http://www.w3.org/2000/svg" width="951" height="2092" viewBox="0 0 951 2092" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:poe2-advisor: a cited build answer</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="950" height="2091" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="273.3,60.0 273.3,98.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,258.0 273.3,296.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,456.0 273.3,494.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,594.0 273.3,632.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,732.0 273.3,790.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="526.5,810.0 626.5,810.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="778.7,770.0 778.7,682.0 526.5,682.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,830.0 273.3,888.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,988.0 273.3,1036.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="526.5,1056.0 626.5,1056.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="778.7,1026.0 778.7,938.0 526.5,938.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,1076.0 273.3,1124.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,1244.0 273.3,1282.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,1482.0 273.3,1520.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,1580.0 273.3,1618.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,1738.0 273.3,1796.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="526.5,1816.0 626.5,1816.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="778.7,1776.0 778.7,1678.0 526.5,1678.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,1836.0 273.3,1894.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,1974.0 273.3,2012.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="20.0" width="506.5" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="273.3" y="44.4" text-anchor="middle">The player asks for a build</text><rect x="20.0" y="98.0" width="506.5" height="160.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="122.4" text-anchor="middle">Apply the workflow: the poe2-advisor skill,</text><text x="273.3" y="142.4" text-anchor="middle">the build_guide prompt or the build_workflow tool</text><text x="273.3" y="162.4" text-anchor="middle">Decide the goal: by default a staged build that</text><text x="273.3" y="182.4" text-anchor="middle">clears the campaign and runs maps up to Tier</text><text x="273.3" y="202.4" text-anchor="middle">16; call campaign_stages for each stage&#x27;s limits</text><text x="273.3" y="222.4" text-anchor="middle">The acts only when asked; an endgame build only for</text><text x="273.3" y="242.4" text-anchor="middle">a level above Tier 16 or a finished late-game build</text><rect x="20.0" y="296.0" width="506.5" height="160.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="320.4" text-anchor="middle">Step 2: gather candidates from the data.</text><text x="273.3" y="340.4" text-anchor="middle">Every choice needs a reason from the records,</text><text x="273.3" y="360.4" text-anchor="middle">never &#x27;ladder characters use it&#x27;</text><text x="273.3" y="380.4" text-anchor="middle">lookup_entity, gems_by, supports_for,</text><text x="273.3" y="400.4" text-anchor="middle">passives_with_stat, get_gem, get_passive</text><text x="273.3" y="420.4" text-anchor="middle">Staged build: plan the last stage first,</text><text x="273.3" y="440.4" text-anchor="middle">then each earlier one, with the stage&#x27;s level as max_level</text><rect x="20.0" y="494.0" width="506.5" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="518.4" text-anchor="middle">Gear: items_by and get_item for a base or unique,</text><text x="273.3" y="538.4" text-anchor="middle">modifiers_for for target modifiers</text><text x="273.3" y="558.4" text-anchor="middle">At most 3 prefixes + 3 suffixes per item, in order of importance.</text><text x="273.3" y="578.4" text-anchor="middle">Staged build: at most the stage&#x27;s support sockets per skill</text><rect x="20.0" y="632.0" width="506.5" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="656.4" text-anchor="middle">Step 3: verify_build</text><text x="273.3" y="676.4" text-anchor="middle">All gems, passives, items and target modifiers in one call</text><text x="273.3" y="696.4" text-anchor="middle">Staged build: with the last stage&#x27;s character_level;</text><text x="273.3" y="716.4" text-anchor="middle">drop what is too_early or move it to a later stage</text><polygon points="34.0,790.0 512.5,790.0 526.5,810.0 512.5,830.0 34.0,830.0 20.0,810.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="273.3" y="814.4" text-anchor="middle">Any unverified names?</text><rect x="626.5" y="770.0" width="304.4" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="778.7" y="794.4" text-anchor="middle">Step 4 (at most two rounds)</text><text x="778.7" y="814.4" text-anchor="middle">Drop the name, or replace it from</text><text x="778.7" y="834.4" text-anchor="middle">its suggestions or a new search</text><rect x="20.0" y="888.0" width="506.5" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="912.4" text-anchor="middle">Step 5: path_to</text><text x="273.3" y="932.4" text-anchor="middle">Class or ascendancy + verified passives → route, order, points</text><text x="273.3" y="952.4" text-anchor="middle">Staged build: targets most important first,</text><text x="273.3" y="972.4" text-anchor="middle">by_stage=true → what each stage reaches</text><polygon points="34.0,1036.0 512.5,1036.0 526.5,1056.0 512.5,1076.0 34.0,1076.0 20.0,1056.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="273.3" y="1060.4" text-anchor="middle">over: more than 123 points, or 8 ascendancy points?</text><rect x="626.5" y="1026.0" width="304.4" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="778.7" y="1050.4" text-anchor="middle">Drop the passives with</text><text x="778.7" y="1070.4" text-anchor="middle">the largest added_points</text><rect x="20.0" y="1124.0" width="506.5" height="120.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="1148.4" text-anchor="middle">Step 6: reference_builds</text><text x="273.3" y="1168.4" text-anchor="middle">Reads the ladder snapshot,</text><text x="273.3" y="1188.4" text-anchor="middle">only to say how the build differs. No character names</text><text x="273.3" y="1208.4" text-anchor="middle">Acts and early map stages: main skill and ascendancy only,</text><text x="273.3" y="1228.4" text-anchor="middle">Tier 16 the whole build; say so when it has no data</text><rect x="20.0" y="1282.0" width="506.5" height="200.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="1306.4" text-anchor="middle">Step 7: write the answer</text><text x="273.3" y="1326.4" text-anchor="middle">Numbers, costs, tags and effects from verified facts only</text><text x="273.3" y="1346.4" text-anchor="middle">Target modifiers are goals to look for. Damage is not calculated</text><text x="273.3" y="1366.4" text-anchor="middle">Staged build: one section per stage: level and points,</text><text x="273.3" y="1386.4" text-anchor="middle">skills, passives, gear, Spirit and ascendancy,</text><text x="273.3" y="1406.4" text-anchor="middle">resistance penalty, an act&#x27;s rewards and bosses</text><text x="273.3" y="1426.4" text-anchor="middle">One search_string per gear slot; map stages:</text><text x="273.3" y="1446.4" text-anchor="middle">waystone_mods for modifiers against the build,</text><text x="273.3" y="1466.4" text-anchor="middle">and a search string leaving them out</text><rect x="20.0" y="1520.0" width="506.5" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="1544.4" text-anchor="middle">Step 8: end with sources_markdown,</text><text x="273.3" y="1564.4" text-anchor="middle">unchanged (it lists the removed names)</text><rect x="20.0" y="1618.0" width="506.5" height="120.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="1642.4" text-anchor="middle">Step 9: export_pob</text><text x="273.3" y="1662.4" text-anchor="middle">Class, targets, skill groups, gear</text><text x="273.3" y="1682.4" text-anchor="middle">Staged build: stage = the last stage (usually maps_t16),</text><text x="273.3" y="1702.4" text-anchor="middle">one passive tree per stage; endgame:</text><text x="273.3" y="1722.4" text-anchor="middle">character_level when a level was asked for</text><polygon points="34.0,1796.0 512.5,1796.0 526.5,1816.0 512.5,1836.0 34.0,1836.0 20.0,1816.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="273.3" y="1820.4" text-anchor="middle">Attributes or Spirit: need above have?</text><rect x="626.5" y="1776.0" width="304.4" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="778.7" y="1800.4" text-anchor="middle">Other gems, fewer persistent skills</text><text x="778.7" y="1820.4" text-anchor="middle">or Spirit-reserving supports, or</text><text x="778.7" y="1840.4" text-anchor="middle">attribute and Spirit modifiers on gear</text><rect x="20.0" y="1894.0" width="506.5" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="1918.4" text-anchor="middle">The answer shows: the code, how_to_import, notes, not_exported,</text><text x="273.3" y="1938.4" text-anchor="middle">have / need for attributes and Spirit,</text><text x="273.3" y="1958.4" text-anchor="middle">PoB Configuration options with their evidence</text><rect x="20.0" y="2012.0" width="506.5" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="273.3" y="2036.4" text-anchor="middle">The player pastes the code into PoB:</text><text x="273.3" y="2056.4" text-anchor="middle">Import/Export Build → paste → Import</text>
<text x="576.5" y="803.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="281.3" y="846.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">none, or two rounds done (what still fails is dropped)</text><text x="576.5" y="1049.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="281.3" y="1092.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="576.5" y="1809.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes, fixable</text><text x="281.3" y="1852.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no. If it cannot be fixed, say plainly what is missing</text>
</svg>
