<svg xmlns="http://www.w3.org/2000/svg" width="951" height="1652" viewBox="0 0 951 1652" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:poe2-advisor: a cited build answer</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="950" height="1651" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="273.3,60.0 273.3,98.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,158.0 273.3,196.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,316.0 273.3,354.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,434.0 273.3,472.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,532.0 273.3,590.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="526.5,610.0 626.5,610.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="778.7,570.0 778.7,502.0 526.5,502.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,630.0 273.3,688.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,748.0 273.3,796.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="526.5,816.0 626.5,816.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="778.7,786.0 778.7,718.0 526.5,718.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,836.0 273.3,884.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,964.0 273.3,1002.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,1082.0 273.3,1120.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,1180.0 273.3,1218.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,1298.0 273.3,1356.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="526.5,1376.0 626.5,1376.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="778.7,1336.0 778.7,1258.0 526.5,1258.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,1396.0 273.3,1454.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="273.3,1534.0 273.3,1572.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="20.0" width="506.5" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="273.3" y="44.4" text-anchor="middle">The player asks for a build</text><rect x="20.0" y="98.0" width="506.5" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="122.4" text-anchor="middle">Apply the workflow: the poe2-advisor skill,</text><text x="273.3" y="142.4" text-anchor="middle">the build_guide prompt or the build_workflow tool</text><rect x="20.0" y="196.0" width="506.5" height="120.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="220.4" text-anchor="middle">Step 2: gather candidates from the data.</text><text x="273.3" y="240.4" text-anchor="middle">Every choice needs a reason from the records,</text><text x="273.3" y="260.4" text-anchor="middle">never &#x27;ladder characters use it&#x27;</text><text x="273.3" y="280.4" text-anchor="middle">lookup_entity, gems_by, supports_for,</text><text x="273.3" y="300.4" text-anchor="middle">passives_with_stat, get_gem, get_passive</text><rect x="20.0" y="354.0" width="506.5" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="378.4" text-anchor="middle">Gear: items_by and get_item for a base or unique,</text><text x="273.3" y="398.4" text-anchor="middle">modifiers_for for target modifiers</text><text x="273.3" y="418.4" text-anchor="middle">At most 3 prefixes + 3 suffixes per item, in order of importance</text><rect x="20.0" y="472.0" width="506.5" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="496.4" text-anchor="middle">Step 3: verify_build</text><text x="273.3" y="516.4" text-anchor="middle">All gems, passives, items and target modifiers in one call</text><polygon points="34.0,590.0 512.5,590.0 526.5,610.0 512.5,630.0 34.0,630.0 20.0,610.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="273.3" y="614.4" text-anchor="middle">Any unverified names?</text><rect x="626.5" y="570.0" width="304.4" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="778.7" y="594.4" text-anchor="middle">Step 4 (at most two rounds)</text><text x="778.7" y="614.4" text-anchor="middle">Drop the name, or replace it from</text><text x="778.7" y="634.4" text-anchor="middle">its suggestions or a new search</text><rect x="20.0" y="688.0" width="506.5" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="712.4" text-anchor="middle">Step 5: path_to</text><text x="273.3" y="732.4" text-anchor="middle">Class or ascendancy + verified passives → route, order, points</text><polygon points="34.0,796.0 512.5,796.0 526.5,816.0 512.5,836.0 34.0,836.0 20.0,816.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="273.3" y="820.4" text-anchor="middle">over: more than 123 points, or 8 ascendancy points?</text><rect x="626.5" y="786.0" width="304.4" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="778.7" y="810.4" text-anchor="middle">Drop the passives with</text><text x="778.7" y="830.4" text-anchor="middle">the largest added_points</text><rect x="20.0" y="884.0" width="506.5" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="908.4" text-anchor="middle">Step 6: reference_builds</text><text x="273.3" y="928.4" text-anchor="middle">Reads the ladder snapshot,</text><text x="273.3" y="948.4" text-anchor="middle">only to say how the build differs. No character names</text><rect x="20.0" y="1002.0" width="506.5" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="1026.4" text-anchor="middle">Step 7: write the answer</text><text x="273.3" y="1046.4" text-anchor="middle">Numbers, costs, tags and effects from verified facts only</text><text x="273.3" y="1066.4" text-anchor="middle">Target modifiers are goals to look for. Damage is not calculated</text><rect x="20.0" y="1120.0" width="506.5" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="1144.4" text-anchor="middle">Step 8: end with sources_markdown,</text><text x="273.3" y="1164.4" text-anchor="middle">unchanged (it lists the removed names)</text><rect x="20.0" y="1218.0" width="506.5" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="1242.4" text-anchor="middle">Step 9: export_pob</text><text x="273.3" y="1262.4" text-anchor="middle">Class, targets, skill groups, gear,</text><text x="273.3" y="1282.4" text-anchor="middle">and character_level when the user asked for a level</text><polygon points="34.0,1356.0 512.5,1356.0 526.5,1376.0 512.5,1396.0 34.0,1396.0 20.0,1376.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="273.3" y="1380.4" text-anchor="middle">Attributes or Spirit: need above have?</text><rect x="626.5" y="1336.0" width="304.4" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="778.7" y="1360.4" text-anchor="middle">Other gems, fewer persistent skills</text><text x="778.7" y="1380.4" text-anchor="middle">or Spirit-reserving supports, or</text><text x="778.7" y="1400.4" text-anchor="middle">attribute and Spirit modifiers on gear</text><rect x="20.0" y="1454.0" width="506.5" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="273.3" y="1478.4" text-anchor="middle">The answer shows: the code, how_to_import, notes, not_exported,</text><text x="273.3" y="1498.4" text-anchor="middle">have / need for attributes and Spirit,</text><text x="273.3" y="1518.4" text-anchor="middle">PoB Configuration options with their evidence</text><rect x="20.0" y="1572.0" width="506.5" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="273.3" y="1596.4" text-anchor="middle">The player pastes the code into PoB:</text><text x="273.3" y="1616.4" text-anchor="middle">Import/Export Build → paste → Import</text>
<text x="576.5" y="603.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="281.3" y="646.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">none, or two rounds done (what still fails is dropped)</text><text x="576.5" y="809.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="281.3" y="852.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="576.5" y="1369.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes, fixable</text><text x="281.3" y="1412.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no. If it cannot be fixed, say plainly what is missing</text>
</svg>
