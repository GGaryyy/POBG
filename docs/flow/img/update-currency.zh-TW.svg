<svg xmlns="http://www.w3.org/2000/svg" width="965" height="904" viewBox="0 0 965 904" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:update currency</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="964" height="903" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="365.3,80.0 365.3,118.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="365.3,218.0 365.3,256.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="365.3,296.0 365.3,334.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="365.3,374.0 365.3,432.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="583.6,452.0 698.7,452.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="147.1,452.0 121.1,452.0 121.1,276.0 147.1,276.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="365.3,472.0 365.3,530.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="365.3,610.0 365.3,648.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="583.6,678.0 698.7,678.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="365.3,708.0 365.3,746.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="365.3,786.0 365.3,824.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="147.1" y="20.0" width="436.5" height="60.0" rx="22.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="365.3" y="44.4" text-anchor="middle">範圍是 currency</text><text x="365.3" y="64.4" text-anchor="middle">可加 older_than_days：N 天前讀的單頁重讀，0 為全部</text><rect x="147.1" y="118.0" width="436.5" height="100.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="365.3" y="142.4" text-anchor="middle">決定要抓的頁面</text><text x="365.3" y="162.4" text-anchor="middle">三個清單頁 × 中英 = 6 個請求（每次都抓）</text><text x="365.3" y="182.4" text-anchor="middle">每個還沒讀過單頁的通貨一個請求：</text><text x="365.3" y="202.4" text-anchor="middle">第一次約 620 個，之後只有新的</text><rect x="147.1" y="256.0" width="436.5" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="365.3" y="280.4" text-anchor="middle">update_data：這次呼叫最多 50 個請求，間隔 0.8 秒</text><rect x="147.1" y="334.0" width="436.5" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="365.3" y="358.4" text-anchor="middle">進度暫存在 output/cache 30 分鐘，中斷後接續而不是重來</text><polygon points="161.1,432.0 569.6,432.0 583.6,452.0 569.6,472.0 161.1,472.0 147.1,452.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="365.3" y="456.4" text-anchor="middle">done：全部頁面都抓到了？</text><rect x="698.7" y="412.0" width="246.0" height="80.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="821.7" y="436.4" text-anchor="middle">已滿 16 次呼叫：</text><text x="821.7" y="456.4" text-anchor="middle">請使用者 30 分鐘內再下一次指令</text><text x="821.7" y="476.4" text-anchor="middle">到此為止沒有寫入</text><rect x="147.1" y="530.0" width="436.5" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="365.3" y="554.4" text-anchor="middle">清單頁：類別（英文分頁）、效果、堆疊數量、</text><text x="365.3" y="574.4" text-anchor="middle">最小詞綴等級、需求等級；中文以網址代稱對上</text><text x="365.3" y="594.4" text-anchor="middle">單頁：掉落等級、類別、標籤；讀不到的留空</text><polygon points="161.1,648.0 569.6,648.0 583.6,678.0 569.6,708.0 161.1,708.0 147.1,678.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="365.3" y="672.4" text-anchor="middle">達到下限？</text><text x="365.3" y="692.4" text-anchor="middle">總數、各類別數、有中文名稱的比例、讀到單頁的比例</text><rect x="698.7" y="658.0" width="246.0" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="821.7" y="682.4" text-anchor="middle">拒絕寫入，保留舊資料</text><rect x="147.1" y="746.0" width="436.5" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="365.3" y="770.4" text-anchor="middle">寫入 data/currency/currency.jsonl，重建名稱索引（通貨）</text><rect x="147.1" y="824.0" width="436.5" height="60.0" rx="22.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="365.3" y="848.4" text-anchor="middle">回報 records、categories、added、</text><text x="365.3" y="868.4" text-anchor="middle">removed、item_pages_failed</text>
<text x="641.1" y="445.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否，已滿 16 次</text><text x="113.1" y="456.0" text-anchor="end" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否，未滿 16 次</text><text x="373.3" y="488.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text><text x="641.1" y="671.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">否</text><text x="373.3" y="724.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">是</text>
</svg>
