<rect x="74.3" y="20.0" width="550.0" height="40.0" rx="20.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="349.3" y="44.4" text-anchor="middle">/pobg:status</text><rect x="74.3" y="98.0" width="550.0" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="349.3" y="122.4" text-anchor="middle">data_status: reads local files only, no network</text><rect x="74.3" y="176.0" width="550.0" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="349.3" y="200.4" text-anchor="middle">Per data set: records, fetch time, age in days,</text><text x="349.3" y="220.4" text-anchor="middle">and which update scope refreshes it</text><rect x="74.3" y="274.0" width="550.0" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="349.3" y="298.4" text-anchor="middle">Point out what is old, including the ladder snapshot and its league</text><polygon points="88.3,352.0 610.3,352.0 624.3,372.0 610.3,392.0 88.3,392.0 74.3,372.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="349.3" y="376.4" text-anchor="middle">Ask the user: check the live sites?</text><rect x="74.3" y="430.0" width="550.0" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="349.3" y="454.4" text-anchor="middle">data_status check_online=true: about 19 requests, 0.8 s apart</text><rect x="74.3" y="528.0" width="550.0" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="349.3" y="552.4" text-anchor="middle">poe2db: do the pages of each kind still parse the way the catalog expects</text><rect x="688.3" y="508.0" width="205.4" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="791.0" y="532.4" text-anchor="middle">GitHub: is there a newer</text><text x="791.0" y="552.4" text-anchor="middle">PathOfBuilding-PoE2</text><text x="791.0" y="572.4" text-anchor="middle">passive tree version</text><rect x="74.3" y="626.0" width="550.0" height="40.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="349.3" y="650.4" text-anchor="middle">Report problems</text><polygon points="88.3,704.0 610.3,704.0 624.3,724.0 610.3,744.0 88.3,744.0 74.3,724.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="349.3" y="728.4" text-anchor="middle">Anything that should be updated?</text><rect x="688.3" y="704.0" width="205.4" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="791.0" y="728.4" text-anchor="middle">Done</text><rect x="74.3" y="782.0" width="550.0" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="349.3" y="806.4" text-anchor="middle">Name the command: /pobg:update with one scope</text>
