<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="924" viewBox="0 0 1012 924" font-family='"Segoe UI", "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif' font-size="14" fill="#1f2328">
<title>/pobg:update items</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="1011" height="923" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<polyline points="368.0,80.0 368.0,118.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="368.0,198.0 368.0,236.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="368.0,296.0 368.0,334.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="368.0,394.0 368.0,452.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="574.6,472.0 700.7,472.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="161.3,472.0 135.3,472.0 135.3,266.0 161.3,266.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="368.0,492.0 368.0,550.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="368.0,630.0 368.0,668.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="574.6,688.0 700.7,688.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="368.0,708.0 368.0,746.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="368.0,826.0 368.0,864.0" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="161.3" y="20.0" width="413.4" height="60.0" rx="22.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="368.0" y="44.4" text-anchor="middle">The scope is items</text><text x="368.0" y="64.4" text-anchor="middle">Optionally item class names such as Bows</text><rect x="161.3" y="118.0" width="413.4" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="368.0" y="142.4" text-anchor="middle">Decide the pages</text><text x="368.0" y="162.4" text-anchor="middle">All: 69 class pages in two languages = 138 requests</text><text x="368.0" y="182.4" text-anchor="middle">Named classes: only those and their attribute pages</text><rect x="161.3" y="236.0" width="413.4" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="368.0" y="260.4" text-anchor="middle">update_data: at most 20 requests this call</text><text x="368.0" y="280.4" text-anchor="middle">(10 class pages in both languages, about 600 KB each)</text><rect x="161.3" y="334.0" width="413.4" height="60.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="368.0" y="358.4" text-anchor="middle">Progress is kept under output/cache for 30 minutes,</text><text x="368.0" y="378.4" text-anchor="middle">so an interrupted run continues</text><polygon points="175.3,452.0 560.6,452.0 574.6,472.0 560.6,492.0 175.3,492.0 161.3,472.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="368.0" y="476.4" text-anchor="middle">done: is every page fetched?</text><rect x="700.7" y="432.0" width="291.8" height="80.0" rx="22.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="846.5" y="456.4" text-anchor="middle">8 calls made: ask the user to run the</text><text x="846.5" y="476.4" text-anchor="middle">command again within 30 minutes</text><text x="846.5" y="496.4" text-anchor="middle">Nothing written so far</text><rect x="161.3" y="550.0" width="413.4" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="368.0" y="574.4" text-anchor="middle">Parse bases,</text><text x="368.0" y="594.4" text-anchor="middle">uniques and the modifier data in the page.</text><text x="368.0" y="614.4" text-anchor="middle">Align English and Chinese, compute tiers</text><polygon points="175.3,668.0 560.6,668.0 574.6,688.0 560.6,708.0 175.3,708.0 161.3,688.0" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/><text x="368.0" y="692.4" text-anchor="middle">Do the counts and modifier data pass the checks?</text><rect x="700.7" y="668.0" width="291.8" height="40.0" rx="20.0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="846.5" y="692.4" text-anchor="middle">Stops, nothing written</text><rect x="161.3" y="746.0" width="413.4" height="80.0" rx="6.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="368.0" y="770.4" text-anchor="middle">Writes bases, uniques and modifiers together</text><text x="368.0" y="790.4" text-anchor="middle">Merged with the existing data when</text><text x="368.0" y="810.4" text-anchor="middle">only some classes were updated</text><rect x="161.3" y="864.0" width="413.4" height="40.0" rx="20.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="368.0" y="888.4" text-anchor="middle">Report bases, uniques, modifiers</text>
<text x="637.7" y="465.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no, 8 calls made</text><text x="127.3" y="476.0" text-anchor="end" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no, under 8 calls</text><text x="376.0" y="508.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><text x="637.7" y="681.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><text x="376.0" y="724.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text>
</svg>
